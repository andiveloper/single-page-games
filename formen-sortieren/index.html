<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fed7aa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Formen sortieren ⭐</title>
  <style>
/* SPG-DESIGN:BEGIN */
/* Single-Page Games: gemeinsame Designsprache v1
   Quelle: design/spg.css. Nicht in den Spielen von Hand ändern,
   sondern hier ändern und `node tools/design.mjs --write` ausführen. */
:root {
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ink: #1e293b;
  --muted: #64748b;
  --surface: #ffffff;
  --surface-2: rgba(255, 255, 255, 0.88);
  --line: #e2e8f0;
  --success: #22c55e;
  --success-2: #34d399;
  --danger: #ef4444;
  --radius: 24px;
  --radius-sm: 18px;
  --tap: 56px;           /* Mindestgröße für Tasten (Kinderfinger) */
  --big: 64px;           /* Höhe großer Knöpfe */
  --gap: 12px;
  --fs-title: clamp(1.25rem, 5vw, 1.8rem);
  --fs-text: 1.05rem;
}
@media (max-width: 360px) { :root { --tap: 50px; --big: 58px; --gap: 8px; } }
@media (min-width: 700px) and (min-height: 700px) { :root { --tap: 68px; --big: 72px; --gap: 16px; } }

/* Kategorie-Farben: .u6 = bis 6 Jahre (warm), .ue6 = ab 6 / Erwachsene (kühl).
   Auf <body> setzen; funktioniert auch auf einzelnen Karten. */
:root, .u6 {
  --primary: #f97316;
  --primary-2: #f59e0b;
  --primary-ink: #c2410c;
  --primary-soft: #fff7ed;
  --primary-line: #fed7aa;
  --bg: linear-gradient(180deg, #fef3c7 0%, #ffedd5 45%, #ffe4e6 100%);
  --shadow: 0 4px 14px rgba(194, 65, 12, 0.12);
}
.ue6 {
  --primary: #6366f1;
  --primary-2: #8b5cf6;
  --primary-ink: #4338ca;
  --primary-soft: #eef2ff;
  --primary-line: #c7d2fe;
  --bg: linear-gradient(180deg, #e0e7ff 0%, #ede9fe 50%, #fae8ff 100%);
  --shadow: 0 4px 14px rgba(67, 56, 202, 0.14);
}

/* ---------- Grundlage ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-text);
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  background-attachment: fixed;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }

/* Vollbild-Spielseite: kein Scrollen, Zoomen, Markieren oder Pull-to-Refresh */
html:has(> body.game) { height: 100%; overflow: hidden; overscroll-behavior: none; }
body.game {
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ---------- Kopfleiste ---------- */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  margin: 8px 8px 0;
  padding: 6px 6px 6px 14px;
  background: var(--surface-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.topbar h1 {
  margin: 0;
  min-width: 0;
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .actions { display: flex; gap: 8px; flex: none; }
/* Spielknöpfe (Zurück, Flagge, Pause …) gehören nicht in die Kopfleiste, sondern in die Leiste unter dem Spielfeld */
.gamebar { flex: none; display: flex; justify-content: center; gap: 12px; margin: 0 8px 8px; }
.gamebar .icon-btn { width: var(--big); height: var(--big); font-size: calc(var(--big) * 0.46); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
@media (min-width: 700px) and (min-height: 700px) { .topbar { margin: 12px 12px 0; padding: 8px 8px 8px 20px; } }
/* Schmales Handy (hoch): die Knöpfe bekommen oben eine eigene Reihe, darunter steht der Spielstand (h1)
   in voller Breite. So verschwinden Punkte, Leben usw. nie hinter den Knöpfen. Quer und am Tablet: eine Reihe. */
@media (max-width: 599px) {
  .topbar { flex-wrap: wrap; justify-content: center; row-gap: 2px; padding: 6px; }
  .topbar .actions { order: -1; width: 100%; justify-content: space-between; }
  .topbar h1 { flex: 1 1 100%; padding: 0 8px 2px; text-align: center; justify-content: center; line-height: 1.35; }
}

/* ---------- Knöpfe ---------- */
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  flex: none;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  box-shadow: inset 0 0 0 2px var(--primary-line), 0 2px 4px rgba(0, 0, 0, 0.08);
  font-size: calc(var(--tap) * 0.48);
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s, background 0.2s;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: #fde68a; box-shadow: inset 0 0 0 2px #f59e0b; }
/* Ton aus (.mute-btn, gesteuert von spg.js): stumm = grau */
.icon-btn.mute-btn[aria-pressed="true"] { background: #e2e8f0; box-shadow: inset 0 0 0 2px #cbd5e1; }

.big-btn {
  width: 100%;
  min-height: var(--big);
  padding: 0 18px;
  border: none;
  border-radius: 20px;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  box-shadow: 0 6px 14px color-mix(in srgb, var(--primary) 35%, transparent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  transition: transform 0.1s;
}
.big-btn:active { transform: scale(0.96); }
.big-btn.success { background: linear-gradient(90deg, var(--success-2), var(--success)); box-shadow: 0 6px 14px rgba(34, 197, 94, 0.35); }
.big-btn.plain { background: #f1f5f9; color: var(--ink); box-shadow: none; }
.big-btn.soft { background: var(--primary-soft); color: var(--primary-ink); box-shadow: inset 0 0 0 2px var(--primary-line); }

.row { display: flex; gap: var(--gap); }
.row > * { flex: 1; }
.stack { display: grid; gap: var(--gap); }

/* Auswahl-Kacheln (Anzahl, Schwierigkeit, Farbe ...) */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
.choice-btn {
  min-height: 84px;
  border: 3px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 1.2rem;
  font-weight: 700;
}
.choice-btn.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); }

/* ---------- Karten, Texte ---------- */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.muted { color: var(--muted); }
.section-label { text-align: left; font-weight: 700; color: var(--muted); margin: 20px 0 8px; font-size: 0.95rem; }

/* ---------- Dialoge ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay[hidden] { display: none; }
/* Die Kopfleiste bleibt über Dialogen bedienbar (🏠 🔊 ⛶ auch im Startbildschirm) */
body.game .topbar { position: relative; z-index: 2100; }
/* --spg-top = Unterkante der Kopfleiste, setzt spg.js (ein- oder zweireihig) */
body.game .overlay { padding-top: calc(var(--spg-top, calc(var(--tap) + 20px)) + 12px); }
body.game .dialog { max-height: calc(100dvh - var(--spg-top, calc(var(--tap) + 20px)) - 28px); }
.dialog {
  width: min(100%, 420px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  touch-action: pan-y;
  background: var(--surface);
  border-radius: 28px;
  padding: 22px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  animation: spg-pop-in 0.25s ease-out;
}
.dialog h2 { margin: 0 0 6px; font-size: 1.6rem; }
.dialog p { margin: 0 0 18px; color: var(--muted); font-weight: 500; }
.big-emoji { font-size: 56px; line-height: 1.1; margin-bottom: 6px; }
@keyframes spg-pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Hinweise, Konfetti ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3000;
  background: #1e293b;
  color: #fff;
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: 600;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast[hidden] { display: none; }
.confetti { position: fixed; inset: 0; z-index: 1500; pointer-events: none; }
.confetti[hidden] { display: none; }

.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
/* SPG-DESIGN:END */

    /* ---------- Formen ---------- */
    .progress { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
    .progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary-line); transition: background 0.3s, transform 0.3s; }
    .progress i.on { background: var(--success); transform: scale(1.2); }
    @media (max-width: 520px) { .progress { margin-left: 2px; } .progress i { width: 9px; height: 9px; } }
    @media (max-width: 370px) { .progress { display: none; } }

    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--gap);
    }
    /* Die Sortierbox: Holzkiste mit Löchern */
    #board {
      position: relative;
      flex: 1.15 1 0;
      min-height: 0;
      border-radius: 28px;
      background: linear-gradient(160deg, #fcd34d 0%, #f59e0b 100%);
      box-shadow: inset 0 -6px 0 rgba(146, 64, 14, 0.25), inset 0 3px 0 rgba(255, 255, 255, 0.5), var(--shadow);
    }
    #tray {
      flex: 1 1 0;
      min-height: 0;
      background: var(--surface-2);
      border-radius: 28px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06), var(--shadow);
    }
    @media (orientation: landscape) {
      #stage { flex-direction: row; }
    }

    .hole, .shape { position: absolute; left: 0; top: 0; }
    .hole svg, .shape svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .hole .fill { fill: rgba(120, 53, 15, 0.38); }
    .hole .edge { fill: none; stroke: rgba(120, 53, 15, 0.55); stroke-width: 4; stroke-linejoin: round; }
    .hole.filled .fill { fill: rgba(120, 53, 15, 0.2); }
    /* Hilfe für die Kleinsten: Löcher in der Farbe der passenden Form */
    .color-holes .hole .fill { fill: color-mix(in srgb, var(--c) 45%, rgba(120, 53, 15, 0.6)); }
    .color-holes .hole .edge { stroke: var(--c); stroke-width: 6; stroke-dasharray: 10 6; }

    .shape {
      z-index: 20;
      touch-action: none;
      cursor: grab;
      will-change: translate, scale;
      transition: scale 0.18s ease-out, rotate 0.18s ease-out;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.25));
    }
    .shape .body { stroke: rgba(0, 0, 0, 0.18); stroke-width: 3; stroke-linejoin: round; }
    .shape .shine { fill: #fff; opacity: 0.35; }
    .shape .face { fill: #1e293b; }
    .shape .smile { fill: none; stroke: #1e293b; stroke-width: 4; stroke-linecap: round; }
    .shape.returning { transition: translate 0.35s ease-out, scale 0.35s ease-out, rotate 0.35s ease-out; }
    .shape.dragging { cursor: grabbing; filter: drop-shadow(0 14px 16px rgba(0,0,0,0.35)); }
    .shape.wrong { animation: wobble 0.4s ease-in-out; }
    @keyframes wobble { 0%, 100% { rotate: 0deg; } 25% { rotate: -14deg; } 75% { rotate: 14deg; } }
    .shape.locked {
      z-index: 5 !important;
      cursor: default;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
      transition: translate 0.15s ease-out, scale 0.15s, rotate 0.15s;
      animation: pop 0.45s ease-out;
    }
    @keyframes pop { 0% { scale: 1; } 40% { scale: 1.18; } 100% { scale: 1; } }

    /* Startbildschirm */
    #count-grid, #holes-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    #menu .choice-btn { min-height: 104px; font-size: 1.6rem; }
    #menu .choice-btn svg { width: 44px; height: 44px; }
  </style>
</head>
<body class="game u6">

  <header class="topbar">
    <h1>⭐ <span class="title-text">Formen</span><span class="progress" id="progress" aria-hidden="true"></span></h1>
    <div class="actions">
      <a class="icon-btn home-btn" href="../" aria-label="Alle Spiele">🏠</a>
      <button class="icon-btn mute-btn" id="btn-mute" aria-label="Ton aus" aria-pressed="true">🔇</button>
      <button class="icon-btn" id="btn-new" aria-label="Neues Spiel">🔄</button>
      <button class="icon-btn fs-btn" aria-label="Vollbild" aria-pressed="false">⛶</button>
    </div>
  </header>

  <main id="stage">
    <div id="board" aria-label="Sortierbox mit Löchern"></div>
    <div id="tray" aria-label="Ablage für Formen"></div>
  </main>

  <!-- Startbildschirm: 1. Anzahl Formen, 2. Löcher bunt oder dunkel -->
  <div class="overlay" id="menu">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div id="step-count">
        <div class="big-emoji">⭐</div>
        <h2 id="menu-title">Wie viele Formen?</h2>
        <div class="choice-grid" id="count-grid" style="margin-top:14px"></div>
        <button class="big-btn plain" id="btn-close-menu" aria-label="Schließen" style="margin-top:20px">✖️</button>
      </div>
      <div id="step-holes" hidden>
        <h2>Welche Löcher?</h2>
        <div class="choice-grid" id="holes-grid" style="margin-top:14px">
          <button class="choice-btn" data-colors="1" aria-label="Bunte Löcher, leichter">
            <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4A46 46 0 1 1 49.9 4Z" fill="#fb7185" stroke="#ef4444" stroke-width="7" stroke-dasharray="12 8"/></svg>
            <span>🎨</span>
          </button>
          <button class="choice-btn" data-colors="0" aria-label="Dunkle Löcher, schwerer">
            <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4A46 46 0 1 1 49.9 4Z" fill="#a16207" stroke="#78350f" stroke-width="5"/></svg>
            <span>🟤</span>
          </button>
        </div>
        <button class="big-btn plain" id="btn-back" aria-label="Zurück" style="margin-top:20px">⬅️</button>
      </div>
    </div>
  </div>

  <!-- Rückfrage bei Neustart -->
  <div class="overlay" id="confirm" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="big-emoji">🔄</div>
      <h2 id="confirm-title">Neu anfangen?</h2>
      <p>Es gibt neue Formen.</p>
      <div class="row">
        <button class="big-btn plain" id="confirm-no" aria-label="Nein">✖️</button>
        <button class="big-btn success" id="confirm-yes" aria-label="Ja">✔️</button>
      </div>
    </div>
  </div>

  <!-- Gewonnen -->
  <div class="overlay" id="win" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="big-emoji">🎉🥳</div>
      <h2 id="win-title">Super gemacht!</h2>
      <p>Alle Formen sind drin!</p>
      <div class="row">
        <button class="big-btn plain" id="btn-win-menu" aria-label="Andere Formen">⭐</button>
        <button class="big-btn" id="btn-again">Nochmal 🚀</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="confetti" hidden></canvas>

  <script>
  'use strict';
/* SPG-JS:BEGIN */
// Gemeinsame Kopfleiste: 🏠 .home-btn, 🔊 .mute-btn, ⛶ .fs-btn (🔄 verdrahtet jedes Spiel selbst).
// Ton ist anfangs aus und gilt für alle Spiele (gleicher Speicher-Schlüssel). Sound.tone() fragt SPG.muted ab.
const SPG = {
  muted: (() => { try { return localStorage.getItem('spg-muted') !== '0'; } catch (e) { return true; } })(),
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('spg-muted', m ? '1' : '0'); } catch (e) {}
    this.render();
  },
  isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  toggleFullscreen() {
    const root = document.documentElement;
    try {
      if (this.isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else Promise.resolve((root.requestFullscreen || root.webkitRequestFullscreen).call(root)).catch(() => {});
    } catch (e) {}
  },
  render() {
    for (const b of document.querySelectorAll('.mute-btn')) {
      b.textContent = this.muted ? '🔇' : '🔊';
      b.setAttribute('aria-pressed', String(this.muted));
    }
    for (const b of document.querySelectorAll('.fs-btn')) {
      b.classList.toggle('active', this.isFullscreen());
      b.setAttribute('aria-pressed', String(this.isFullscreen()));
    }
  }
};
document.addEventListener('click', (e) => {
  if (!e.target.closest) return;
  if (e.target.closest('.mute-btn')) SPG.setMuted(!SPG.muted);
  if (e.target.closest('.fs-btn')) SPG.toggleFullscreen();
});
document.addEventListener('fullscreenchange', () => SPG.render());
document.addEventListener('webkitfullscreenchange', () => SPG.render());
window.addEventListener('storage', (e) => {
  if (e.key === 'spg-muted') { SPG.muted = e.newValue !== '0'; SPG.render(); }
});
// Zur Spieleübersicht nur online, die heruntergeladene Datei steht allein.
// Vollbild gibt es nicht überall (z. B. iPhone).
if (location.protocol === 'file:') for (const a of document.querySelectorAll('.home-btn')) a.hidden = true;
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {
  for (const b of document.querySelectorAll('.fs-btn')) b.hidden = true;
}
// Dialoge beginnen unter der Kopfleiste, die am schmalen Handy zweireihig ist.
const spgTop = document.querySelector('.topbar');
if (spgTop) {
  const setTop = () => document.documentElement.style.setProperty('--spg-top', Math.ceil(spgTop.getBoundingClientRect().bottom) + 'px');
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(spgTop);
  window.addEventListener('resize', setTop);
}
SPG.render();
/* SPG-JS:END */

  /* ===================================================================
     Töne (Web Audio, keine Dateien nötig)
     =================================================================== */
  const Sound = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    tone(freq, start, dur, type = 'sine', vol = 0.3, endFreq) {
      if (SPG.muted) return;
      const t = this.ctx.currentTime + start;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur * 0.8);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    },
    pick() { this.init(); if (this.ctx) this.tone(500, 0, 0.06, 'sine', 0.12, 650); },
    // Jede Form hat ihren eigenen Ton beim Einrasten (Tonleiter)
    snap(step = 0) {
      this.init();
      if (!this.ctx) return;
      const f = 392 * Math.pow(2, [0, 2, 4, 5, 7, 9, 11, 12][step % 8] / 12);
      this.tone(f * 0.6, 0, 0.1, 'sine', 0.3, f);
      this.tone(f, 0.09, 0.25, 'triangle', 0.25);
    },
    // Falsches Loch: freundliches „Boing“, kein Fehlerton
    boing() { this.init(); if (this.ctx) this.tone(220, 0, 0.3, 'sine', 0.25, 120); },
    win() {
      this.init();
      if (!this.ctx) return;
      [261.63, 329.63, 392.0, 523.25, 659.25, 783.99].forEach((f, i) => this.tone(f, i * 0.1, 0.38, 'triangle', 0.28));
    }
  };

  function buzz(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }

  /* ===================================================================
     Konfetti
     =================================================================== */
  const Confetti = {
    canvas: document.getElementById('confetti'),
    raf: null,
    parts: [],
    start() {
      const c = this.canvas;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = innerWidth * dpr;
      c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
      c.hidden = false;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
      const n = Math.round(Math.min(160, innerWidth / 5));
      this.parts = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth,
        y: -Math.random() * innerHeight,
        s: Math.random() * 10 + 6,
        c: colors[(Math.random() * colors.length) | 0],
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 3 + 2.5,
        r: Math.random() * 360,
        vr: (Math.random() - 0.5) * 10
      }));
      const end = performance.now() + 7000;
      const loop = (now) => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of this.parts) {
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          if (p.y > innerHeight + 20 && now < end) p.y = -20;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
          ctx.restore();
        }
        if (now < end + 4000) this.raf = requestAnimationFrame(loop);
        else this.stop();
      };
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(loop);
    },
    stop() {
      cancelAnimationFrame(this.raf);
      this.canvas.hidden = true;
    }
  };

  /* ===================================================================
     Formen (SVG, viewBox 0 0 100 100). face = Mitte des Gesichts.
     =================================================================== */
  function starPath(points, outer, inner, cx = 50, cy = 53) {
    let d = '';
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 ? inner : outer;
      const a = -Math.PI / 2 + (i * Math.PI) / points;
      d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
    }
    return d + 'Z';
  }

  const SHAPES = [
    { id: 'kreis',    name: 'Kreis',    d: 'M50 4A46 46 0 1 1 49.9 4Z', face: [50, 50] },
    { id: 'quadrat',  name: 'Quadrat',  d: 'M18 6H82Q94 6 94 18V82Q94 94 82 94H18Q6 94 6 82V18Q6 6 18 6Z', face: [50, 50] },
    { id: 'dreieck',  name: 'Dreieck',  d: 'M43 10Q50 -1 57 10L95 82Q100 94 87 94H13Q0 94 5 82Z', face: [50, 66] },
    { id: 'stern',    name: 'Stern',    d: starPath(5, 49, 22), face: [50, 56] },
    { id: 'herz',     name: 'Herz',     d: 'M50 94C24 74 4 56 4 33C4 17 16 6 30 6C40 6 46 12 50 20C54 12 60 6 70 6C84 6 96 17 96 33C96 56 76 74 50 94Z', face: [50, 42] },
    { id: 'mond',     name: 'Mond',     d: 'M58 4A47 47 0 1 0 96 66A38 38 0 0 1 58 4Z', face: [32, 56] },
    { id: 'sechseck', name: 'Sechseck', d: 'M28 9H72L95 50L72 91H28L5 50Z', face: [50, 50] },
    { id: 'raute',    name: 'Raute',    d: 'M50 3L95 50L50 97L5 50Z', face: [50, 50] },
    { id: 'kreuz',    name: 'Kreuz',    d: 'M36 4H64V36H96V64H64V96H36V64H4V36H36Z', face: [50, 50] },
    { id: 'blume',    name: 'Blume',    d: flowerPath(), face: [50, 50] }
  ];

  function flowerPath() {
    // 6 Blütenblätter als Bögen um einen Kreis
    const n = 6, R = 30, r = 19;
    let d = '';
    for (let i = 0; i < n; i++) {
      const a1 = (i / n) * Math.PI * 2 - Math.PI / 2;
      const a2 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2;
      const p1 = [50 + R * Math.cos(a1), 50 + R * Math.sin(a1)];
      const p2 = [50 + R * Math.cos(a2), 50 + R * Math.sin(a2)];
      d += (i ? '' : `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`) + `A${r} ${r} 0 1 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d + 'Z';
  }

  const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#facc15', '#a855f7', '#ec4899', '#f97316', '#14b8a6', '#6366f1', '#84cc16'];
  const COUNTS = [3, 4, 6, 8];

  const SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function shapeSVG(shape, color) {
    const svg = svgEl('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' });
    svg.appendChild(svgEl('path', { d: shape.d, fill: color, class: 'body' }));
    const [fx, fy] = shape.face;
    svg.appendChild(svgEl('ellipse', { cx: fx - 14, cy: fy - 18, rx: 8, ry: 5, class: 'shine', transform: `rotate(-30 ${fx - 14} ${fy - 18})` }));
    svg.appendChild(svgEl('circle', { cx: fx - 9, cy: fy - 4, r: 4.5, class: 'face' }));
    svg.appendChild(svgEl('circle', { cx: fx + 9, cy: fy - 4, r: 4.5, class: 'face' }));
    svg.appendChild(svgEl('path', { d: `M${fx - 8} ${fy + 6}Q${fx} ${fy + 13} ${fx + 8} ${fy + 6}`, class: 'smile' }));
    return svg;
  }

  function holeSVG(shape) {
    const svg = svgEl('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' });
    svg.appendChild(svgEl('path', { d: shape.d, class: 'fill' }));
    svg.appendChild(svgEl('path', { d: shape.d, class: 'edge' }));
    return svg;
  }

  /* ===================================================================
     Hilfsfunktionen
     =================================================================== */
  const $ = (id) => document.getElementById(id);

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Raster mit möglichst großen Zellen für n Dinge in einer Fläche w × h
  function bestGrid(n, w, h) {
    let best = { cols: 1, rows: n, cell: 0 };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const cell = Math.min(w / cols, h / rows);
      if (cell > best.cell) best = { cols, rows, cell };
    }
    return best;
  }

  // Zellmitten, die letzte Reihe mittig
  function gridCenters(n, g, x, y, w, h) {
    const cw = w / g.cols, ch = h / g.rows;
    const last = n - (g.rows - 1) * g.cols;
    const out = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / g.cols), col = i % g.cols;
      const off = row === g.rows - 1 ? (g.cols - last) / 2 : 0;
      out.push([x + (col + off + 0.5) * cw, y + (row + 0.5) * ch]);
    }
    return out;
  }

  const Store = {
    get(k, d) { try { const v = localStorage.getItem('formen-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('formen-' + k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ===================================================================
     Spiel
     =================================================================== */
  class ShapeGame {
    constructor() {
      this.stage = $('stage');
      this.board = $('board');
      this.tray = $('tray');
      this.progressEl = $('progress');

      this.count = COUNTS.includes(Store.get('count', 4)) ? Store.get('count', 4) : 4;
      this.colorHoles = !!Store.get('colors', false);
      this.items = [];        // { shape, color, hole, el, ... }
      this.won = false;
      this.zTop = 20;
      this.lastSize = '';

      this.bindUI();
      this.buildCountButtons();
      this.applyColorHoles();
      this.openMenu();
    }

    /* ---------- Oberfläche ---------- */
    bindUI() {
      $('btn-new').addEventListener('click', () => {
        if (this.hasProgress()) this.ask(() => this.openMenu());
        else this.openMenu();
      });

      const menu = $('menu');
      $('btn-close-menu').addEventListener('click', () => this.closeMenu());
      menu.addEventListener('click', (e) => { if (e.target === menu) this.closeMenu(); });
      $('btn-back').addEventListener('click', () => { Sound.pick(); this.showStep('count'); });

      for (const b of document.querySelectorAll('#holes-grid .choice-btn')) {
        b.addEventListener('click', () => {
          Sound.pick();
          this.colorHoles = b.dataset.colors === '1';
          Store.set('colors', this.colorHoles);
          this.applyColorHoles();
          $('menu').hidden = true;
          this.newGame();
        });
      }

      $('btn-win-menu').addEventListener('click', () => {
        $('win').hidden = true;
        Confetti.stop();
        this.openMenu();
      });

      $('btn-again').addEventListener('click', () => {
        $('win').hidden = true;
        Confetti.stop();
        this.newGame();
      });

      // Kein Kontextmenü bei langem Drücken
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      // Drehen / Größe ändern (verzögert, damit es nicht ständig neu rechnet)
      let t;
      const onResize = () => { clearTimeout(t); t = setTimeout(() => this.relayout(), 180); };
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', onResize);
    }

    buildCountButtons() {
      const grid = $('count-grid');
      grid.innerHTML = '';
      for (const n of COUNTS) {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.dataset.count = n;
        b.setAttribute('aria-label', `${n} Formen`);
        // Vorschau: so viele kleine Formen, wie es geben wird
        const icons = SHAPES.slice(0, n).map((sh, i) => `<svg viewBox="0 0 100 100" style="width:18px;height:18px"><path d="${sh.d}" fill="${COLORS[i]}"/></svg>`).join('');
        b.innerHTML = `<span aria-hidden="true" style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:84px">${icons}</span><span>${n}</span>`;
        grid.appendChild(b);
        b.addEventListener('click', () => {
          Sound.pick();
          this.count = n;
          Store.set('count', n);
          this.showStep('holes');
        });
      }
    }

    applyColorHoles() {
      this.board.classList.toggle('color-holes', this.colorHoles);
    }

    /* ---------- Startbildschirm ---------- */
    openMenu() {
      this.showStep('count');
      $('btn-close-menu').hidden = !this.items.length;   // ohne laufendes Spiel gibt es nichts zum Zurückkehren
      $('menu').hidden = false;
    }

    closeMenu() {
      if (!this.items.length) return;
      $('menu').hidden = true;
    }

    showStep(step) {
      $('step-count').hidden = step !== 'count';
      $('step-holes').hidden = step !== 'holes';
      const sel = step === 'count' ? '#count-grid .choice-btn' : '#holes-grid .choice-btn';
      for (const b of document.querySelectorAll(sel)) {
        b.classList.toggle('selected', step === 'count' ? Number(b.dataset.count) === this.count : (b.dataset.colors === '1') === this.colorHoles);
      }
    }

    ask(onYes) {
      const dlg = $('confirm');
      dlg.hidden = false;
      const done = (yes) => {
        dlg.hidden = true;
        $('confirm-yes').onclick = $('confirm-no').onclick = null;
        if (yes) onYes();
      };
      $('confirm-yes').onclick = () => done(true);
      $('confirm-no').onclick = () => done(false);
    }

    hasProgress() {
      return !this.won && this.items.some((it) => it.locked);
    }

    /* ---------- Spielstart ---------- */
    newGame() {
      Confetti.stop();
      $('win').hidden = true;
      this.won = false;

      for (const it of this.items) if (it.el) it.el.remove();
      const shapes = shuffle(SHAPES.slice()).slice(0, this.count);
      const colors = shuffle(COLORS.slice());
      this.items = shapes.map((shape, i) => ({ shape, color: colors[i], step: i, locked: false, slotRot: 0 }));
      this.holeOrder = shuffle(this.items.map((_, i) => i));
      this.trayOrder = shuffle(this.items.map((_, i) => i));
      for (const it of this.items) it.slotRot = (Math.random() - 0.5) * 30;
      this.build();
    }

    relayout() {
      const key = `${innerWidth}x${innerHeight}`;
      if (key === this.lastSize || !this.items.length) return;
      this.build();
    }

    rectIn(el) {
      const s = this.stage.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
    }

    /* Löcher und Formen aufbauen. Eingerastete Formen bleiben drin. */
    build() {
      this.lastSize = `${innerWidth}x${innerHeight}`;
      this.board.innerHTML = '';
      for (const it of this.items) if (it.el) it.el.remove();
      this.zTop = 20;

      const n = this.items.length;
      const br = this.rectIn(this.board);
      const pad = 14;
      const g = bestGrid(n, br.w - pad * 2, br.h - pad * 2);
      this.size = Math.floor(Math.min(g.cell * 0.78, 190));
      const centers = gridCenters(n, g, pad, pad, br.w - pad * 2, br.h - pad * 2);

      this.holeOrder.forEach((idx, i) => {
        const it = this.items[idx];
        const [cx, cy] = centers[i];
        const hole = document.createElement('div');
        hole.className = 'hole' + (it.locked ? ' filled' : '');
        hole.style.setProperty('--c', it.color);
        // Loch minimal größer als die Form, damit sie sichtbar „hineinpasst“
        const hs = this.size * 1.08;
        hole.style.width = hole.style.height = hs + 'px';
        hole.style.translate = `${cx - hs / 2}px ${cy - hs / 2}px`;
        hole.appendChild(holeSVG(it.shape));
        this.board.appendChild(hole);
        it.hole = hole;
        it.tx = br.x + cx;
        it.ty = br.y + cy;
      });

      for (const it of this.items) {
        const el = document.createElement('div');
        el.className = 'shape';
        el.style.width = el.style.height = this.size + 'px';
        el.setAttribute('aria-label', it.shape.name);
        el.appendChild(shapeSVG(it.shape, it.color));
        it.el = el;
        it.w = it.h = this.size;
        it.pointer = null;
        it.scale = 1;
        it.rot = 0;
        this.attach(it);
        this.stage.appendChild(el);
        if (it.locked) {
          it.x = it.tx;
          it.y = it.ty;
          el.classList.add('locked');
          el.style.animation = 'none';
          this.apply(it);
        }
      }

      this.layoutTray();
      for (const it of this.items) if (!it.locked) this.toTray(it, false);
      this.updateProgress();
    }

    /* Plätze in der Ablage berechnen (verkleinert, leicht schräg) */
    layoutTray() {
      const n = this.items.length;
      const tr = this.rectIn(this.tray);
      const pad = 10;
      const g = bestGrid(n, tr.w - pad * 2, tr.h - pad * 2);
      const centers = gridCenters(n, g, tr.x + pad, tr.y + pad, tr.w - pad * 2, tr.h - pad * 2);
      const scale = Math.min(1, (g.cell * 0.82) / this.size);
      this.trayOrder.forEach((idx, i) => {
        const it = this.items[idx];
        [it.slotX, it.slotY] = centers[i];
        it.slotScale = scale;
      });
    }

    toTray(it, animate) {
      it.x = it.slotX;
      it.y = it.slotY;
      it.scale = it.slotScale;
      it.rot = it.slotRot;
      if (animate) {
        it.el.classList.add('returning');
        setTimeout(() => it.el.classList.remove('returning'), 380);
      }
      this.apply(it);
    }

    apply(it) {
      it.el.style.translate = `${it.x - it.w / 2}px ${it.y - it.h / 2}px`;
      it.el.style.scale = String(it.scale);
      it.el.style.rotate = `${it.rot}deg`;
    }

    /* ---------- Ziehen ---------- */
    attach(it) {
      const el = it.el;

      el.addEventListener('pointerdown', (e) => {
        if (it.locked || it.pointer !== null) return;
        e.preventDefault();
        Sound.pick();
        it.pointer = e.pointerId;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}

        const s = this.stage.getBoundingClientRect();
        const px = e.clientX - s.left, py = e.clientY - s.top;
        it.offX = (px - it.x) / it.scale;
        it.offY = (py - it.y) / it.scale;
        // Form leicht über den Finger heben, damit man sie sieht
        it.lift = Math.min(24, Math.max(0, (it.h / 2 - Math.abs(it.offY)) * 0.35));

        it.scale = 1;
        it.rot = 0;
        el.style.zIndex = ++this.zTop;
        el.classList.add('dragging');
        el.classList.remove('returning', 'wrong');
        this.move(it, px, py);
      });

      el.addEventListener('pointermove', (e) => {
        if (it.pointer !== e.pointerId) return;
        const s = this.stage.getBoundingClientRect();
        this.move(it, e.clientX - s.left, e.clientY - s.top);
      });

      const end = (e) => {
        if (it.pointer !== e.pointerId) return;
        it.pointer = null;
        try { el.releasePointerCapture(e.pointerId); } catch (err) {}
        el.classList.remove('dragging');
        this.drop(it);
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('lostpointercapture', end);
    }

    move(it, px, py) {
      const s = this.stage.getBoundingClientRect();
      it.x = Math.min(Math.max(px - it.offX, 0), s.width);
      it.y = Math.min(Math.max(py - it.offY - it.lift, 0), s.height);
      this.apply(it);
    }

    drop(it) {
      // Großzügiger Fangradius für Kinderhände
      const snap = Math.max(40, this.size * 0.55);

      if (Math.hypot(it.x - it.tx, it.y - it.ty) < snap) {
        it.locked = true;
        it.x = it.tx;
        it.y = it.ty;
        it.el.classList.add('locked');
        it.hole.classList.add('filled');
        this.apply(it);
        Sound.snap(it.step);
        buzz(30);
        this.updateProgress();
        if (this.items.every((x) => x.locked)) this.win();
        return;
      }

      // Über einem anderen Loch: wackeln, „Boing“ und zurück in die Ablage
      const wrong = this.items.some((o) => o !== it && !o.locked && Math.hypot(it.x - o.tx, it.y - o.ty) < snap);
      if (wrong) {
        Sound.boing();
        it.el.classList.add('wrong');
        setTimeout(() => { it.el.classList.remove('wrong'); this.toTray(it, true); }, 400);
        return;
      }
      this.toTray(it, true);
    }

    updateProgress() {
      const done = this.items.filter((it) => it.locked).length;
      let html = '';
      for (let i = 0; i < this.items.length; i++) html += `<i class="${i < done ? 'on' : ''}"></i>`;
      this.progressEl.innerHTML = html;
    }

    win() {
      this.won = true;
      setTimeout(() => {
        Sound.win();
        buzz([60, 60, 120]);
        Confetti.start();
        setTimeout(() => ($('win').hidden = false), 600);
      }, 400);
    }
  }

  window.addEventListener('DOMContentLoaded', () => { window.game = new ShapeGame(); });
  </script>
</body>
</html>
