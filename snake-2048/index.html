<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e0e7ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Snake 2048 🐍</title>
  <style>
/* SPG-DESIGN:BEGIN */
/* Single-Page Games: gemeinsame Designsprache v1
   Quelle: design/spg.css. Nicht in den Spielen von Hand ändern,
   sondern hier ändern und `node tools/design.mjs --write` ausführen. */
:root {
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ink: #1e293b;
  --muted: #64748b;
  --surface: #ffffff;
  --surface-2: rgba(255, 255, 255, 0.88);
  --line: #e2e8f0;
  --success: #22c55e;
  --success-2: #34d399;
  --danger: #ef4444;
  --radius: 24px;
  --radius-sm: 18px;
  --tap: 56px;           /* Mindestgröße für Tasten (Kinderfinger) */
  --big: 64px;           /* Höhe großer Knöpfe */
  --gap: 12px;
  --fs-title: clamp(1.25rem, 5vw, 1.8rem);
  --fs-text: 1.05rem;
}
@media (max-width: 360px) { :root { --tap: 50px; --big: 58px; --gap: 8px; } }
@media (min-width: 700px) and (min-height: 700px) { :root { --tap: 68px; --big: 72px; --gap: 16px; } }

/* Kategorie-Farben: .u6 = bis 6 Jahre (warm), .ue6 = ab 6 / Erwachsene (kühl).
   Auf <body> setzen; funktioniert auch auf einzelnen Karten. */
:root, .u6 {
  --primary: #f97316;
  --primary-2: #f59e0b;
  --primary-ink: #c2410c;
  --primary-soft: #fff7ed;
  --primary-line: #fed7aa;
  --bg: linear-gradient(180deg, #fef3c7 0%, #ffedd5 45%, #ffe4e6 100%);
  --shadow: 0 4px 14px rgba(194, 65, 12, 0.12);
}
.ue6 {
  --primary: #6366f1;
  --primary-2: #8b5cf6;
  --primary-ink: #4338ca;
  --primary-soft: #eef2ff;
  --primary-line: #c7d2fe;
  --bg: linear-gradient(180deg, #e0e7ff 0%, #ede9fe 50%, #fae8ff 100%);
  --shadow: 0 4px 14px rgba(67, 56, 202, 0.14);
}

/* ---------- Grundlage ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-text);
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  background-attachment: fixed;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }

/* Vollbild-Spielseite: kein Scrollen, Zoomen, Markieren oder Pull-to-Refresh */
html:has(> body.game) { height: 100%; overflow: hidden; overscroll-behavior: none; }
body.game {
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ---------- Kopfleiste ---------- */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  margin: 8px 8px 0;
  padding: 6px 6px 6px 14px;
  background: var(--surface-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.topbar h1 {
  margin: 0;
  min-width: 0;
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .actions { display: flex; gap: 8px; flex: none; }
/* Spielknöpfe (Zurück, Flagge, Pause …) gehören nicht in die Kopfleiste, sondern in die Leiste unter dem Spielfeld */
.gamebar { flex: none; display: flex; justify-content: center; gap: 12px; margin: 0 8px 8px; }
.gamebar .icon-btn { width: var(--big); height: var(--big); font-size: calc(var(--big) * 0.46); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
@media (min-width: 700px) and (min-height: 700px) { .topbar { margin: 12px 12px 0; padding: 8px 8px 8px 20px; } }
/* Schmales Handy (hoch): die Knöpfe bekommen oben eine eigene Reihe, darunter steht der Spielstand (h1)
   in voller Breite. So verschwinden Punkte, Leben usw. nie hinter den Knöpfen. Quer und am Tablet: eine Reihe. */
@media (max-width: 599px) {
  .topbar { flex-wrap: wrap; justify-content: center; row-gap: 2px; padding: 6px; }
  .topbar .actions { order: -1; width: 100%; justify-content: space-between; }
  .topbar h1 { flex: 1 1 100%; padding: 0 8px 2px; text-align: center; justify-content: center; line-height: 1.35; }
}

/* ---------- Knöpfe ---------- */
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  flex: none;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  box-shadow: inset 0 0 0 2px var(--primary-line), 0 2px 4px rgba(0, 0, 0, 0.08);
  font-size: calc(var(--tap) * 0.48);
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s, background 0.2s;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: #fde68a; box-shadow: inset 0 0 0 2px #f59e0b; }
/* Ton aus (.mute-btn, gesteuert von spg.js): stumm = grau */
.icon-btn.mute-btn[aria-pressed="true"] { background: #e2e8f0; box-shadow: inset 0 0 0 2px #cbd5e1; }

.big-btn {
  width: 100%;
  min-height: var(--big);
  padding: 0 18px;
  border: none;
  border-radius: 20px;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  box-shadow: 0 6px 14px color-mix(in srgb, var(--primary) 35%, transparent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  transition: transform 0.1s;
}
.big-btn:active { transform: scale(0.96); }
.big-btn.success { background: linear-gradient(90deg, var(--success-2), var(--success)); box-shadow: 0 6px 14px rgba(34, 197, 94, 0.35); }
.big-btn.plain { background: #f1f5f9; color: var(--ink); box-shadow: none; }
.big-btn.soft { background: var(--primary-soft); color: var(--primary-ink); box-shadow: inset 0 0 0 2px var(--primary-line); }

.row { display: flex; gap: var(--gap); }
.row > * { flex: 1; }
.stack { display: grid; gap: var(--gap); }

/* Auswahl-Kacheln (Anzahl, Schwierigkeit, Farbe ...) */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
.choice-btn {
  min-height: 84px;
  border: 3px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 1.2rem;
  font-weight: 700;
}
.choice-btn.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); }

/* ---------- Karten, Texte ---------- */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.muted { color: var(--muted); }
.section-label { text-align: left; font-weight: 700; color: var(--muted); margin: 20px 0 8px; font-size: 0.95rem; }

/* ---------- Dialoge ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay[hidden] { display: none; }
/* Die Kopfleiste bleibt über Dialogen bedienbar (🏠 🔊 ⛶ auch im Startbildschirm) */
body.game .topbar { position: relative; z-index: 2100; }
/* --spg-top = Unterkante der Kopfleiste, setzt spg.js (ein- oder zweireihig) */
body.game .overlay { padding-top: calc(var(--spg-top, calc(var(--tap) + 20px)) + 12px); }
body.game .dialog { max-height: calc(100dvh - var(--spg-top, calc(var(--tap) + 20px)) - 28px); }
.dialog {
  width: min(100%, 420px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  touch-action: pan-y;
  background: var(--surface);
  border-radius: 28px;
  padding: 22px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  animation: spg-pop-in 0.25s ease-out;
}
.dialog h2 { margin: 0 0 6px; font-size: 1.6rem; }
.dialog p { margin: 0 0 18px; color: var(--muted); font-weight: 500; }
.big-emoji { font-size: 56px; line-height: 1.1; margin-bottom: 6px; }
@keyframes spg-pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Hinweise, Konfetti ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3000;
  background: #1e293b;
  color: #fff;
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: 600;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast[hidden] { display: none; }
.confetti { position: fixed; inset: 0; z-index: 1500; pointer-events: none; }
.confetti[hidden] { display: none; }

.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
/* SPG-DESIGN:END */

    /* ---------- Snake 2048 ---------- */
    .topbar h1 { display: flex; align-items: center; gap: 12px; }
    .topbar h1 .best { font-size: 0.75em; color: var(--muted); }

    #stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      padding: var(--gap);
    }
    #board-wrap { flex: 1 1 auto; min-height: 0; align-self: stretch; display: grid; place-items: center; }
    #board {
      display: block;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 3px solid var(--primary-line);
      box-shadow: var(--shadow);
    }

    /* Steuerkreuz (zusätzlich zum Wischen), eng zusammen für einen Daumen */
    #pad {
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, var(--tap));
      grid-template-rows: repeat(3, var(--tap));
      gap: 2px;
    }
    #pad .icon-btn { width: var(--tap); height: var(--tap); font-size: calc(var(--tap) * 0.46); }
    #pad [data-dir="up"] { grid-area: 1 / 2; }
    #pad [data-dir="left"] { grid-area: 2 / 1; }
    #pad [data-dir="right"] { grid-area: 2 / 3; }
    #pad [data-dir="down"] { grid-area: 3 / 2; }
    #pad .hub { grid-area: 2 / 2; display: grid; place-items: center; font-size: calc(var(--big) * 0.42); opacity: 0.5; }
    #pad .icon-btn.hit { background: var(--primary-line); }
    body.no-pad #pad { display: none; }
    /* Rechtshänder: Steuerkreuz am rechten Rand, Pause links daneben; Linkshänder gespiegelt */
    .controls { flex: none; display: flex; flex-direction: row-reverse; align-items: center; gap: 14px; align-self: flex-end; }
    body.pad-left .controls { flex-direction: row; align-self: flex-start; }
    .pause-btn { width: 76px; height: 76px; font-size: 36px; border-radius: 22px; }
    .pause-btn.active { background: #fde68a; box-shadow: inset 0 0 0 2px #f59e0b; }

    /* Querformat: Steuerkreuz rechts neben dem Spielfeld */
    @media (orientation: landscape) {
      #stage { flex-direction: row; }
      .controls, body.pad-left .controls { flex-direction: column; align-self: center; }
      body.pad-left #stage { flex-direction: row-reverse; }
      #board-wrap { align-self: stretch; }
    }
    /* Wenig Platz (Handy quer): kleineres Steuerkreuz */
    @media (max-height: 480px) {
      #pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
      #pad .icon-btn { width: 48px; height: 48px; }
    }

    .rules { display: grid; gap: 6px; margin: 4px 0 6px; text-align: left; justify-content: center; font-weight: 700; }
    .rules div { display: flex; align-items: center; gap: 8px; }
    .rules .mini {
      display: inline-grid; place-items: center;
      min-width: 30px; height: 30px; padding: 0 4px; border-radius: 8px;
      font-size: 0.9rem; font-weight: 800; color: #fff; background: #6366f1;
    }
    .rules .mini.v2 { background: #eef2ff; color: #4338ca; box-shadow: inset 0 0 0 1.5px #c7d2fe; }
    .rules .mini.v4 { background: #e0e7ff; color: #4338ca; box-shadow: inset 0 0 0 1.5px #c7d2fe; }
    .rules .mini.v8 { background: #a5b4fc; }

    .choice-grid { grid-template-columns: repeat(3, 1fr); }
    .choice-btn { min-height: 76px; gap: 2px; }
    .choice-btn span { font-size: 1.7rem; line-height: 1; }
    .choice-btn small { font-size: 0.9rem; font-weight: 700; }
    .dialog .score-line { font-size: 1.3rem; color: var(--ink); font-weight: 700; }
  </style>
</head>
<body class="game ue6">

  <header class="topbar">
    <h1><span class="logo">🐍</span> <span id="score" aria-label="Punkte">2</span> <span class="best" aria-label="Rekord">🏆 <span id="best">0</span></span></h1>
    <div class="actions">
      <button class="icon-btn" id="btn-pause" aria-label="Pause">⏸️</button>
      <a class="icon-btn home-btn" href="../" aria-label="Alle Spiele">🏠</a>
      <button class="icon-btn mute-btn" id="btn-mute" aria-label="Ton aus" aria-pressed="true">🔇</button>
      <button class="icon-btn" id="btn-new" aria-label="Neues Spiel">🔄</button>
      <button class="icon-btn fs-btn" aria-label="Vollbild" aria-pressed="false">⛶</button>
    </div>
  </header>

  <main id="stage">
    <div id="board-wrap"><canvas id="board" aria-label="Spielfeld"></canvas></div>
    <div class="controls">
    <div id="pad" aria-label="Steuerkreuz">
      <button class="icon-btn" data-dir="up" aria-label="Hoch">⬆️</button>
      <button class="icon-btn" data-dir="left" aria-label="Links">⬅️</button>
      <div class="hub" aria-hidden="true">🐍</div>
      <button class="icon-btn" data-dir="right" aria-label="Rechts">➡️</button>
      <button class="icon-btn" data-dir="down" aria-label="Runter">⬇️</button>
    </div>
    <button class="icon-btn pause-btn" id="btn-pause-big" aria-label="Pause">⏸️</button>
    </div>
  </main>

  <!-- Start / Einstellungen -->
  <div class="overlay" id="setup" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <div class="big-emoji">🐍</div>
      <h2 id="setup-title">Snake 2048</h2>
      <p>Wischen zum Lenken.</p>
      <div class="rules">
        <div><span class="mini v2">2</span>+<span class="mini v2">2</span>→<span class="mini v4">4</span> gleich: verschmelzen</div>
        <div><span class="mini v4">4</span>+<span class="mini v2">2</span>→<span class="mini v2">2</span><span class="mini v4">4</span> kleiner: vorne dran</div>
        <div><span class="mini v4">4</span>+<span class="mini v8">8</span>→💥 größer: vorbei!</div>
      </div>

      <div class="section-label">Tempo</div>
      <div class="choice-grid" id="speed-grid">
        <button class="choice-btn" data-speed="slow"><span>🐢</span><small>Langsam</small></button>
        <button class="choice-btn" data-speed="mid"><span>🐇</span><small>Mittel</small></button>
        <button class="choice-btn" data-speed="fast"><span>🚀</span><small>Schnell</small></button>
      </div>

      <div class="section-label">Tasten</div>
      <div class="choice-grid" id="pad-grid">
        <button class="choice-btn" data-pad="left"><span>🫲</span><small>Links</small></button>
        <button class="choice-btn" data-pad="right"><span>🫱</span><small>Rechts</small></button>
        <button class="choice-btn" data-pad="off"><span>👆</span><small>Nur wischen</small></button>
      </div>

      <button class="big-btn" id="btn-go" style="margin-top:20px">▶️ Los</button>
    </div>
  </div>

  <!-- Rückfrage bei Neustart -->
  <div class="overlay" id="confirm" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="big-emoji">🔄</div>
      <h2 id="confirm-title">Neu anfangen?</h2>
      <p>Die Punkte gehen verloren.</p>
      <div class="row">
        <button class="big-btn plain" id="confirm-no" aria-label="Nein">✖️</button>
        <button class="big-btn success" id="confirm-yes" aria-label="Ja">✔️</button>
      </div>
    </div>
  </div>

  <!-- Vorbei -->
  <div class="overlay" id="over" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="over-title">
      <div class="big-emoji" id="over-emoji">💥</div>
      <h2 id="over-title">Vorbei!</h2>
      <p id="over-reason"></p>
      <p class="score-line" id="over-text"></p>
      <button class="big-btn" id="btn-again">🔄 Nochmal</button>
    </div>
  </div>

  <canvas id="confetti" class="confetti" hidden></canvas>

  <script>
  'use strict';
/* SPG-JS:BEGIN */
// Gemeinsame Kopfleiste: 🏠 .home-btn, 🔊 .mute-btn, ⛶ .fs-btn (🔄 verdrahtet jedes Spiel selbst).
// Ton ist anfangs aus und gilt für alle Spiele (gleicher Speicher-Schlüssel). Sound.tone() fragt SPG.muted ab.
const SPG = {
  muted: (() => { try { return localStorage.getItem('spg-muted') !== '0'; } catch (e) { return true; } })(),
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('spg-muted', m ? '1' : '0'); } catch (e) {}
    this.render();
  },
  isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  toggleFullscreen() {
    const root = document.documentElement;
    try {
      if (this.isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else Promise.resolve((root.requestFullscreen || root.webkitRequestFullscreen).call(root)).catch(() => {});
    } catch (e) {}
  },
  render() {
    for (const b of document.querySelectorAll('.mute-btn')) {
      b.textContent = this.muted ? '🔇' : '🔊';
      b.setAttribute('aria-pressed', String(this.muted));
    }
    for (const b of document.querySelectorAll('.fs-btn')) {
      b.classList.toggle('active', this.isFullscreen());
      b.setAttribute('aria-pressed', String(this.isFullscreen()));
    }
  }
};
document.addEventListener('click', (e) => {
  if (!e.target.closest) return;
  if (e.target.closest('.mute-btn')) SPG.setMuted(!SPG.muted);
  if (e.target.closest('.fs-btn')) SPG.toggleFullscreen();
});
document.addEventListener('fullscreenchange', () => SPG.render());
document.addEventListener('webkitfullscreenchange', () => SPG.render());
window.addEventListener('storage', (e) => {
  if (e.key === 'spg-muted') { SPG.muted = e.newValue !== '0'; SPG.render(); }
});
// Zur Spieleübersicht nur online, die heruntergeladene Datei steht allein.
// Vollbild gibt es nicht überall (z. B. iPhone).
if (location.protocol === 'file:') for (const a of document.querySelectorAll('.home-btn')) a.hidden = true;
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {
  for (const b of document.querySelectorAll('.fs-btn')) b.hidden = true;
}
// Dialoge beginnen unter der Kopfleiste, die am schmalen Handy zweireihig ist.
const spgTop = document.querySelector('.topbar');
if (spgTop) {
  const setTop = () => document.documentElement.style.setProperty('--spg-top', Math.ceil(spgTop.getBoundingClientRect().bottom) + 'px');
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(spgTop);
  window.addEventListener('resize', setTop);
}
SPG.render();
/* SPG-JS:END */

  const $ = (id) => document.getElementById(id);

  /* ===================================================================
     Speichern (Rekorde, Einstellungen)
     =================================================================== */
  const Store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('spg-snake2048-' + key); return v === null ? fallback : JSON.parse(v); }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('spg-snake2048-' + key, JSON.stringify(value)); } catch (e) {}
    }
  };

  /* ===================================================================
     Töne (Web Audio, keine Dateien nötig)
     =================================================================== */
  const Sound = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    tone(freq, start, dur, type = 'sine', vol = 0.3, endFreq) {
      if (SPG.muted) return;
      const t = this.ctx.currentTime + start;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur * 0.8);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    },
    ready() { this.init(); return !!this.ctx; },
    click() { if (this.ready()) this.tone(500, 0, 0.06, 'sine', 0.12, 650); },
    eat() { if (this.ready()) { this.tone(520, 0, 0.08, 'square', 0.08, 780); this.tone(780, 0.06, 0.1, 'sine', 0.2, 1040); } },
    // Höherer Ton für größere Zahlen
    merge(value) {
      if (!this.ready()) return;
      const f = 330 * Math.pow(2, Math.min(Math.log2(value), 14) / 4);
      this.tone(f, 0, 0.12, 'triangle', 0.25, f * 1.5);
      this.tone(f * 1.5, 0.08, 0.16, 'sine', 0.18, f * 2);
    },
    crash() { if (this.ready()) { this.tone(300, 0, 0.45, 'sawtooth', 0.18, 60); this.tone(120, 0.05, 0.4, 'square', 0.1, 50); } },
    win() {
      if (!this.ready()) return;
      [261.63, 329.63, 392.0, 523.25, 659.25, 783.99].forEach((f, i) => this.tone(f, i * 0.1, 0.38, 'triangle', 0.28));
    }
  };

  function buzz(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }

  /* ===================================================================
     Konfetti
     =================================================================== */
  const Confetti = {
    canvas: $('confetti'),
    raf: null,
    parts: [],
    start() {
      const c = this.canvas;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = innerWidth * dpr;
      c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
      c.hidden = false;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
      const n = Math.round(Math.min(160, innerWidth / 5));
      this.parts = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth,
        y: -Math.random() * innerHeight,
        s: Math.random() * 10 + 6,
        c: colors[(Math.random() * colors.length) | 0],
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 3 + 2.5,
        r: Math.random() * 360,
        vr: (Math.random() - 0.5) * 10
      }));
      const end = performance.now() + 7000;
      const loop = (now) => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of this.parts) {
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          if (p.y > innerHeight + 20 && now < end) p.y = -20;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
          ctx.restore();
        }
        if (now < end + 4000) this.raf = requestAnimationFrame(loop);
        else this.stop();
      };
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(loop);
    },
    stop() {
      cancelAnimationFrame(this.raf);
      this.canvas.hidden = true;
    }
  };

  /* ===================================================================
     Spiel
     Die Schlange besteht aus Zahlen. Gleiche Zahl fressen: der Kopf verdoppelt sich.
     Kleinere Zahl: kommt vorne dran. Größere Zahl: vorbei.
     Gleiche Nachbarn in der Schlange verschmelzen sofort weiter.
     =================================================================== */
  const SIZE = 20;                                   // Feld: 20 × 20
  const NUM_FOODS = 5;                               // so viele Zahlen liegen immer aus
  const SPEEDS = { slow: 150, mid: 100, fast: 70 };  // ms pro Schritt
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Farben wie im 2048 dieser Sammlung
  const TILE = {
    2: ['#eef2ff', '#4338ca'], 4: ['#e0e7ff', '#4338ca'], 8: ['#a5b4fc', '#fff'], 16: ['#818cf8', '#fff'],
    32: ['#6366f1', '#fff'], 64: ['#4f46e5', '#fff'], 128: ['#a78bfa', '#fff'], 256: ['#8b5cf6', '#fff'],
    512: ['#7c3aed', '#fff'], 1024: ['#d946ef', '#fff'], 2048: [['#f59e0b', '#ec4899'], '#fff']
  };
  const TILE_BIG = [['#1e1b4b', '#7c3aed'], '#fff'];

  const Game = {
    canvas: $('board'),
    ctx: $('board').getContext('2d'),
    cell: 20,
    // 'ready' wartet auf erste Richtung, 'run', 'paused', 'over'
    state: 'ready',
    speed: Store.get('speed', 'mid'),
    pad: Store.get('pad', 'right'),   // left | right | off
    snake: [],
    dir: null,          // null: die Schlange steht noch
    queue: [],
    foods: [],
    justPrepended: false,
    score: 0,
    best: 0,
    started: false,
    stepMs: 100,
    acc: 0,
    last: 0,
    crashAt: 0,
    pops: [],           // kurze Aufblas-Animation bei Verschmelzungen

    init() {
      if (!SPEEDS[this.speed]) this.speed = 'mid';
      if (!['left', 'right', 'off'].includes(this.pad)) this.pad = 'right';
      this.bindUi();
      this.bindInput();
      new ResizeObserver(() => this.layout()).observe($('board-wrap'));
      this.applyPad();
      this.newGame();
      this.openSetup();
      requestAnimationFrame((t) => this.frame(t));
    },

    /* ---------- Spielzustand ---------- */
    newGame() {
      const mid = SIZE >> 1;
      this.snake = [{ x: mid, y: mid, value: 2 }];   // Start mit einer einzelnen 2
      this.dir = null;
      this.queue = [];
      this.justPrepended = false;
      this.pops = [];
      this.started = false;
      this.best = Store.get('best-' + this.speed, 0);
      this.stepMs = SPEEDS[this.speed];
      this.acc = 0;
      this.state = 'ready';
      this.foods = [];
      for (let i = 0; i < NUM_FOODS; i++) this.spawnFood();
      this.score = this.calcScore();
      this.updateHud();
    },

    inProgress() { return (this.state === 'run' || this.state === 'paused') && this.started; },

    calcScore() { return this.snake.reduce((sum, s) => sum + s.value, 0); },

    // Größte Zahl, die ausliegen darf: die zweitgrößte Zahl der Schlange (mindestens 4)
    secondHighest() {
      const values = [...new Set(this.snake.map((s) => s.value))].sort((a, b) => b - a);
      return Math.max(4, values.length >= 2 ? values[1] : values[0]);
    },

    // Zufallszahl bis max, kleine Zahlen viel häufiger
    randomValue(max) {
      const values = [2, 4];
      for (let v = 8; v <= max && v <= 2048; v *= 2) values.push(v);
      const pool = values.filter((v) => v <= max);
      if (!pool.length) pool.push(2);
      const weights = pool.map((v) => (v === 2 ? 20 : v === 4 ? 10 : v === 8 ? 4 : v === 16 ? 2 : 1));
      let r = Math.random() * weights.reduce((a, b) => a + b, 0);
      for (let i = 0; i < pool.length; i++) {
        if (r < weights[i]) return pool[i];
        r -= weights[i];
      }
      return pool[0];
    },

    spawnFood() {
      // Eine 2 und eine 4 liegen immer aus, damit es weitergeht
      const max = this.secondHighest();
      let value;
      if (!this.foods.some((f) => f.value === 2) && this.foods.length < NUM_FOODS) value = 2;
      else if (!this.foods.some((f) => f.value === 4) && max >= 4 && this.foods.length < NUM_FOODS) value = 4;
      else value = this.randomValue(max);

      const taken = new Set([...this.snake, ...this.foods].map((p) => p.x + ',' + p.y));
      const free = [];
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (!taken.has(x + ',' + y)) free.push({ x, y });
      if (!free.length) return;
      const f = free[(Math.random() * free.length) | 0];
      f.value = value;
      f.born = performance.now();
      this.foods.push(f);
    },

    turn(d) {
      if (this.state === 'over' || !$('setup').hidden || !$('confirm').hidden) return;
      // Steht die Schlange noch, geht jede Richtung sofort
      if (!this.dir) {
        this.dir = d;
        this.resume();
        return;
      }
      const lastDir = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
      if (d === lastDir || d === OPPOSITE[lastDir]) {
        // Zurück geht nicht, aber eine Pause wird trotzdem beendet
        if (this.state === 'paused') this.resume();
        return;
      }
      if (this.queue.length < 2) this.queue.push(d);
      if (this.state === 'paused') this.resume();
    },

    resume() {
      Sound.init();
      this.state = 'run';
      this.acc = 0;
      this.updateHud();
    },

    pause() {
      if (this.state !== 'run') return;
      this.state = 'paused';
      this.updateHud();
    },

    step() {
      if (this.queue.length) {
        const d = this.queue.shift();
        if (d !== OPPOSITE[this.dir]) this.dir = d;
      }
      if (!this.dir) return;
      this.started = true;

      const [dx, dy] = DIRS[this.dir];
      const head = this.snake[0];
      const x = head.x + dx, y = head.y + dy;

      // 1. Wand
      if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return this.gameOver('wall');

      // 2. Zahl fressen
      const fi = this.foods.findIndex((f) => f.x === x && f.y === y);
      let merged = false;
      if (fi !== -1) {
        const value = this.foods[fi].value;
        if (value === head.value) {
          // Gleich: Kopf rückt vor und verdoppelt sich
          this.moveTo(x, y);
          head.value *= 2;
          this.justPrepended = false;
          merged = true;
        } else if (value < head.value) {
          // Kleiner: neuer Kopf vorne dran
          this.snake.unshift({ x, y, value });
          this.justPrepended = true;
        } else {
          // Größer: vorbei
          this.foods[fi].hit = true;
          return this.gameOver('big');
        }
      } else {
        // 3. Normal weiter
        this.moveTo(x, y);
        this.justPrepended = false;
      }

      // 4. Gleiche Nachbarn verschmelzen, auch mehrfach hintereinander
      const cascaded = this.cascade();

      // 5. In sich selbst gelaufen?
      if (this.bitSelf()) return this.gameOver('self');

      // 6. Punkte und neue Zahl
      if (fi !== -1) {
        this.score = this.calcScore();
        this.foods.splice(fi, 1);
        this.spawnFood();
        if (merged || cascaded) { Sound.merge(this.snake[0].value); this.pop(0); }
        else Sound.eat();
        buzz(30);
        this.updateHud();
      } else if (cascaded) {
        this.score = this.calcScore();
        Sound.merge(this.snake[0].value);
        this.updateHud();
      }
    },

    // Körper rückt nach, Kopf auf das neue Feld
    moveTo(x, y) {
      for (let i = this.snake.length - 1; i > 0; i--) {
        this.snake[i].x = this.snake[i - 1].x;
        this.snake[i].y = this.snake[i - 1].y;
      }
      this.snake[0].x = x;
      this.snake[0].y = y;
    },

    cascade() {
      let any = false, again = true;
      while (again) {
        again = false;
        for (let i = 0; i < this.snake.length - 1; i++) {
          if (this.snake[i].value === this.snake[i + 1].value) {
            this.snake[i].value *= 2;
            this.snake.splice(i + 1, 1);
            this.pop(i);
            again = any = true;
            break;
          }
        }
      }
      return any;
    },

    bitSelf() {
      if (this.justPrepended || this.snake.length <= 1) return false;
      const h = this.snake[0];
      return this.snake.some((s, i) => i > 0 && s.x === h.x && s.y === h.y);
    },

    pop(index) {
      if (reducedMotion) return;
      this.pops.push({ seg: this.snake[index], at: performance.now() });
    },

    gameOver(reason) {
      this.state = 'over';
      this.crashAt = performance.now();
      const record = this.score > this.best;
      if (record) { this.best = this.score; Store.set('best-' + this.speed, this.best); }
      this.updateHud();

      if (record) { Sound.win(); buzz([60, 60, 120]); Confetti.start(); }
      else { Sound.crash(); buzz([80, 40, 160]); }

      $('over-emoji').textContent = record ? '🏆🎉' : '💥';
      $('over-title').textContent = record ? 'Neuer Rekord!' : 'Vorbei!';
      $('over-reason').textContent = { wall: '🧱 Gegen die Wand', self: '🐍 Selbst gebissen', big: '🔢 Zahl zu groß' }[reason];
      $('over-text').textContent = `⭐ ${this.score}   ·   🏆 ${this.best}`;
      setTimeout(() => { if (this.state === 'over') $('over').hidden = false; }, record ? 500 : 700);
    },

    updateHud() {
      $('score').textContent = this.score;
      $('best').textContent = this.best;
      for (const btn of [$('btn-pause'), $('btn-pause-big')]) {
        btn.textContent = this.state === 'paused' ? '▶️' : '⏸️';
        btn.setAttribute('aria-label', this.state === 'paused' ? 'Weiter' : 'Pause');
        btn.classList.toggle('active', this.state === 'paused');
      }
    },

    /* ---------- Schleife ---------- */
    frame(now) {
      // Zuerst das nächste Bild anmelden, damit ein Fehler beim Zeichnen das Spiel nicht anhält
      requestAnimationFrame((t) => this.frame(t));
      const dt = Math.min(now - (this.last || now), 250);
      this.last = now;
      if (this.state === 'run') {
        this.acc += dt;
        while (this.acc >= this.stepMs && this.state === 'run') {
          this.acc -= this.stepMs;
          this.step();
        }
      }
      this.draw(now);
    },

    /* ---------- Zeichnen ---------- */
    layout() {
      const wrap = $('board-wrap');
      const avail = Math.min(wrap.clientWidth, wrap.clientHeight) - 6;  // 6 = Rahmen
      this.cell = Math.max(8, Math.floor(avail / SIZE));
      const px = this.cell * SIZE;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      this.canvas.width = px * dpr;
      this.canvas.height = px * dpr;
      this.canvas.style.width = px + 'px';
      this.canvas.style.height = px + 'px';
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.draw(performance.now());
    },

    draw(now) {
      const { ctx, cell } = this;
      const px = cell * SIZE;
      const css = getComputedStyle(document.body);
      const soft = css.getPropertyValue('--primary-soft').trim() || '#eef2ff';
      const line = css.getPropertyValue('--primary-line').trim() || '#c7d2fe';
      const ink = css.getPropertyValue('--primary-ink').trim() || '#4338ca';
      const font = css.getPropertyValue('--font');

      ctx.clearRect(0, 0, px, px);
      // Schachbrett
      ctx.fillStyle = soft;
      for (let y = 0; y < SIZE; y++) for (let x = (y & 1); x < SIZE; x += 2) ctx.fillRect(x * cell, y * cell, cell, cell);

      // Ausliegende Zahlen: etwas kleiner und pulsierend, damit man sie von der Schlange unterscheidet
      for (const f of this.foods) {
        // Der Bild-Zeitstempel kann knapp vor f.born liegen, daher nie unter 0
        const grow = reducedMotion ? 1 : Math.min(1, Math.max(0, (now - f.born) / 200));
        const pulse = reducedMotion ? 1 : 1 + Math.sin(now / 180) * 0.04;
        const blink = f.hit && this.state === 'over' && !reducedMotion ? 0.5 + 0.5 * Math.cos((now - this.crashAt) / 60) : 1;
        ctx.globalAlpha = blink;
        this.drawTile(f.x, f.y, f.value, 0.78 * grow * pulse, font);
        ctx.globalAlpha = 1;
      }

      const shake = this.state === 'over' && !reducedMotion && now - this.crashAt < 350
        ? Math.sin((now - this.crashAt) / 18) * cell * 0.15 : 0;
      ctx.save();
      ctx.translate(shake, 0);

      // Verbindungen zwischen den Gliedern
      ctx.strokeStyle = line;
      ctx.lineWidth = cell * 0.45;
      ctx.lineCap = 'round';
      for (let i = 1; i < this.snake.length; i++) {
        const a = this.snake[i - 1], b = this.snake[i];
        ctx.beginPath();
        ctx.moveTo((a.x + 0.5) * cell, (a.y + 0.5) * cell);
        ctx.lineTo((b.x + 0.5) * cell, (b.y + 0.5) * cell);
        ctx.stroke();
      }

      // Glieder vom Schwanz zum Kopf
      this.pops = this.pops.filter((p) => now - p.at < 220);
      for (let i = this.snake.length - 1; i >= 0; i--) {
        const s = this.snake[i];
        const p = this.pops.find((q) => q.seg === s);
        const scale = p ? 0.94 + 0.2 * Math.sin(Math.PI * (now - p.at) / 220) : 0.94;
        this.drawTile(s.x, s.y, s.value, scale, font);
      }

      // Kopf: Rahmen und Augen in Laufrichtung
      const h = this.snake[0];
      const r = cell * 0.94;
      ctx.strokeStyle = ink;
      ctx.lineWidth = Math.max(2, cell * 0.1);
      roundRectPath(ctx, (h.x + 0.5) * cell - r / 2, (h.y + 0.5) * cell - r / 2, r, r, cell * 0.22);
      ctx.stroke();
      this.drawEyes();
      ctx.restore();

      // Hinweis vor dem Start bzw. in der Pause
      if ((this.state === 'ready' || this.state === 'paused') && $('setup').hidden) {
        const text = this.state === 'ready' ? '👆 Wischen!' : '⏸️ Pause';
        ctx.font = `700 ${Math.round(cell * 1.3)}px ${font}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const w = ctx.measureText(text).width + cell * 1.6;
        const hh = cell * 2.4;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        roundRectPath(ctx, (px - w) / 2, px * 0.8 - hh / 2, w, hh, hh / 2);
        ctx.fill();
        ctx.fillStyle = ink;
        ctx.fillText(text, px / 2, px * 0.8 + cell * 0.08);
      }
    },

    drawTile(x, y, value, scale, font) {
      const { ctx, cell } = this;
      const [bg, fg] = TILE[value] || TILE_BIG;
      const size = cell * scale;
      const cx = (x + 0.5) * cell, cy = (y + 0.5) * cell;
      const left = cx - size / 2, top = cy - size / 2;
      if (Array.isArray(bg)) {
        const g = ctx.createLinearGradient(left, top, left + size, top + size);
        g.addColorStop(0, bg[0]); g.addColorStop(1, bg[1]);
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = bg;
      }
      roundRectPath(ctx, left, top, size, size, size * 0.22);
      ctx.fill();
      // Helle Kacheln (2, 4) brauchen einen Rand, sonst verschwinden sie im Schachbrett
      if (value <= 4) {
        ctx.strokeStyle = '#a5b4fc';
        ctx.lineWidth = Math.max(1, cell * 0.06);
        ctx.stroke();
      }
      const label = formatValue(value);
      const fs = size * [0, 0.6, 0.52, 0.42, 0.34][Math.min(label.length, 4)];
      ctx.fillStyle = fg;
      ctx.font = `800 ${fs}px ${font}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, cx, cy + size * 0.04, size * 0.88);
    },

    drawEyes() {
      const { ctx, cell } = this;
      const h = this.snake[0];
      const d = this.queue.length && this.state !== 'run' ? this.queue[0] : (this.dir || 'up');
      const [dx, dy] = DIRS[d];
      const cx = (h.x + 0.5) * cell, cy = (h.y + 0.5) * cell;
      const dead = this.state === 'over';
      // Augen an der Vorderkante, quer zur Laufrichtung
      const side = cell * 0.26, front = cell * 0.47;
      const er = Math.max(2, cell * 0.12);
      for (const k of [-1, 1]) {
        const ex = cx + dx * front + -dy * side * k;
        const ey = cy + dy * front + dx * side * k;
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = Math.max(1, cell * 0.04);
        ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        if (dead) {
          ctx.lineWidth = Math.max(1.2, cell * 0.05);
          const a = er * 0.55;
          ctx.beginPath(); ctx.moveTo(ex - a, ey - a); ctx.lineTo(ex + a, ey + a); ctx.moveTo(ex + a, ey - a); ctx.lineTo(ex - a, ey + a); ctx.stroke();
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.beginPath(); ctx.arc(ex + dx * er * 0.3, ey + dy * er * 0.3, er * 0.5, 0, Math.PI * 2); ctx.fill();
        }
      }
    },

    /* ---------- Bedienung ---------- */
    bindInput() {
      // Wischen irgendwo im Spielbereich; nach jeder erkannten Richtung neu ansetzen,
      // damit man ohne Absetzen mehrfach lenken kann
      let start = null, moved = false;
      const stage = $('stage');
      stage.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.controls')) return;
        start = { x: e.clientX, y: e.clientY, id: e.pointerId };
        moved = false;
      });
      stage.addEventListener('pointermove', (e) => {
        if (!start || e.pointerId !== start.id) return;
        const dx = e.clientX - start.x, dy = e.clientY - start.y;
        const th = Math.max(18, this.cell * 0.9);
        if (Math.abs(dx) < th && Math.abs(dy) < th) return;
        this.turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        start.x = e.clientX; start.y = e.clientY;
        moved = true;
      });
      const end = (e) => {
        if (!start || e.pointerId !== start.id) return;
        if (!moved && this.state === 'paused' && e.type === 'pointerup') this.resume();
        start = null;
      };
      stage.addEventListener('pointerup', end);
      stage.addEventListener('pointercancel', end);

      for (const b of document.querySelectorAll('#pad [data-dir]')) {
        b.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.turn(b.dataset.dir);
          b.classList.add('hit');
          setTimeout(() => b.classList.remove('hit'), 120);
        });
      }

      const keys = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
      };
      // Wird gerade mit Tab durch die Knöpfe gegangen (statt Maus oder Finger)?
      let tabbing = false;
      document.addEventListener('pointerdown', () => { tabbing = false; }, true);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') tabbing = true;
        // Am PC startet eine Pfeiltaste oder Enter direkt aus dem Startbildschirm
        const setupOpen = !$('setup').hidden && $('confirm').hidden;
        if (keys[e.key]) {
          e.preventDefault();
          if (setupOpen) this.closeSetup();
          this.turn(keys[e.key]);
        }
        else if (e.key === 'Enter' && setupOpen) {
          // Mit Tab gewählte Auswahlknöpfe (Tempo, Tasten) behalten ihr eigenes Enter.
          // Nach einem Mausklick bleibt der Fokus zwar dort, dann soll Enter aber starten.
          const choice = e.target.closest && e.target.closest('#setup .choice-btn');
          if (choice && tabbing) return;
          e.preventDefault();
          this.closeSetup();
        }
        else if ((e.key === ' ' || e.key === 'p' || e.key === 'P' || e.key === 'Escape') && $('setup').hidden && $('over').hidden) {
          e.preventDefault();
          this.togglePause();
        }
      });

      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); });
    },

    togglePause() {
      if (document.querySelector('.overlay:not([hidden])')) return;
      if (this.state === 'run') this.pause();
      else if (this.state === 'paused') this.resume();
    },

    bindUi() {
      for (const id of ['btn-pause', 'btn-pause-big']) $(id).addEventListener('click', () => { Sound.click(); this.togglePause(); });
      $('btn-new').addEventListener('click', () => {
        Sound.click();
        // 🔄 = neue Runde über den Startbildschirm (Tempo, Tasten)
        if (this.inProgress()) { this.pause(); $('confirm').hidden = false; }
        else { this.restart(); this.openSetup(); }
      });
      $('confirm-no').addEventListener('click', () => { Sound.click(); $('confirm').hidden = true; });
      $('confirm-yes').addEventListener('click', () => { Sound.click(); $('confirm').hidden = true; this.restart(); this.openSetup(); });

      $('btn-again').addEventListener('click', () => { Sound.click(); this.restart(); });
      $('btn-go').addEventListener('click', () => this.closeSetup());

      for (const b of document.querySelectorAll('#speed-grid [data-speed]')) {
        b.addEventListener('click', () => { Sound.click(); this.speed = b.dataset.speed; Store.set('speed', this.speed); this.refreshSetup(); });
      }
      for (const b of document.querySelectorAll('#pad-grid [data-pad]')) {
        b.addEventListener('click', () => { Sound.click(); this.pad = b.dataset.pad; Store.set('pad', this.pad); this.applyPad(); this.refreshSetup(); });
      }
    },

    restart() {
      Confetti.stop();
      $('over').hidden = true;
      this.newGame();
    },

    openSetup() { this.refreshSetup(); $('setup').hidden = false; },

    closeSetup() {
      Sound.init(); Sound.click();
      $('setup').hidden = true;
      // Geändertes Tempo: neue Runde mit eigenem Rekord
      if (this.stepMs !== SPEEDS[this.speed]) this.newGame();
    },

    refreshSetup() {
      for (const b of document.querySelectorAll('[data-speed]')) b.classList.toggle('selected', b.dataset.speed === this.speed);
      for (const b of document.querySelectorAll('[data-pad]')) b.classList.toggle('selected', b.dataset.pad === this.pad);
      const changed = this.stepMs !== SPEEDS[this.speed];
      $('btn-go').textContent = this.inProgress() && !changed ? '▶️ Weiter' : '▶️ Los';
    },

    applyPad() {
      document.body.classList.toggle('no-pad', this.pad === 'off');
      document.body.classList.toggle('pad-left', this.pad === 'left');
    }
  };

  /* ---------- Hilfen ---------- */
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    // roundRect wirft bei negativen Werten und würde die Zeichenschleife anhalten
    w = Math.max(0, w); h = Math.max(0, h); r = Math.max(0, Math.min(r, w / 2, h / 2));
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  // 1024 = 1K, 1048576 = 1M …, damit große Zahlen in die Kachel passen
  function formatValue(v) {
    if (v < 1024) return String(v);
    const units = ['K', 'M', 'G', 'T'];
    let u = -1;
    while (v >= 1024 && u < units.length - 1) { v /= 1024; u++; }
    return Math.floor(v) + units[u];
  }

  Game.init();
  </script>
