<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fed7aa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ausmalbild 🎨</title>
  <style>
/* SPG-DESIGN:BEGIN */
/* Single-Page Games: gemeinsame Designsprache v1
   Quelle: design/spg.css. Nicht in den Spielen von Hand ändern,
   sondern hier ändern und `node tools/design.mjs --write` ausführen. */
:root {
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ink: #1e293b;
  --muted: #64748b;
  --surface: #ffffff;
  --surface-2: rgba(255, 255, 255, 0.88);
  --line: #e2e8f0;
  --success: #22c55e;
  --success-2: #34d399;
  --danger: #ef4444;
  --radius: 24px;
  --radius-sm: 18px;
  --tap: 56px;           /* Mindestgröße für Tasten (Kinderfinger) */
  --big: 64px;           /* Höhe großer Knöpfe */
  --gap: 12px;
  --fs-title: clamp(1.25rem, 5vw, 1.8rem);
  --fs-text: 1.05rem;
}
@media (max-width: 360px) { :root { --tap: 50px; --big: 58px; --gap: 8px; } }
@media (min-width: 700px) and (min-height: 700px) { :root { --tap: 68px; --big: 72px; --gap: 16px; } }

/* Kategorie-Farben: .u6 = bis 6 Jahre (warm), .ue6 = ab 6 / Erwachsene (kühl).
   Auf <body> setzen; funktioniert auch auf einzelnen Karten. */
:root, .u6 {
  --primary: #f97316;
  --primary-2: #f59e0b;
  --primary-ink: #c2410c;
  --primary-soft: #fff7ed;
  --primary-line: #fed7aa;
  --bg: linear-gradient(180deg, #fef3c7 0%, #ffedd5 45%, #ffe4e6 100%);
  --shadow: 0 4px 14px rgba(194, 65, 12, 0.12);
}
.ue6 {
  --primary: #6366f1;
  --primary-2: #8b5cf6;
  --primary-ink: #4338ca;
  --primary-soft: #eef2ff;
  --primary-line: #c7d2fe;
  --bg: linear-gradient(180deg, #e0e7ff 0%, #ede9fe 50%, #fae8ff 100%);
  --shadow: 0 4px 14px rgba(67, 56, 202, 0.14);
}

/* ---------- Grundlage ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-text);
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  background-attachment: fixed;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }

/* Vollbild-Spielseite: kein Scrollen, Zoomen, Markieren oder Pull-to-Refresh */
html:has(> body.game) { height: 100%; overflow: hidden; overscroll-behavior: none; }
body.game {
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ---------- Kopfleiste ---------- */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  margin: 8px 8px 0;
  padding: 6px 6px 6px 14px;
  background: var(--surface-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.topbar h1 {
  margin: 0;
  min-width: 0;
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .actions { display: flex; gap: 8px; flex: none; }
/* Spielknöpfe (Zurück, Flagge, Pause …) gehören nicht in die Kopfleiste, sondern in die Leiste unter dem Spielfeld */
.gamebar { flex: none; display: flex; justify-content: center; gap: 12px; margin: 0 8px 8px; }
.gamebar .icon-btn { width: var(--big); height: var(--big); font-size: calc(var(--big) * 0.46); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
@media (min-width: 700px) and (min-height: 700px) { .topbar { margin: 12px 12px 0; padding: 8px 8px 8px 20px; } }
/* Schmales Handy (hoch): die Knöpfe bekommen oben eine eigene Reihe, darunter steht der Spielstand (h1)
   in voller Breite. So verschwinden Punkte, Leben usw. nie hinter den Knöpfen. Quer und am Tablet: eine Reihe. */
@media (max-width: 599px) {
  .topbar { flex-wrap: wrap; justify-content: center; row-gap: 2px; padding: 6px; }
  .topbar .actions { order: -1; width: 100%; justify-content: space-between; }
  .topbar h1 { flex: 1 1 100%; padding: 0 8px 2px; text-align: center; justify-content: center; line-height: 1.35; }
}

/* ---------- Knöpfe ---------- */
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  flex: none;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  box-shadow: inset 0 0 0 2px var(--primary-line), 0 2px 4px rgba(0, 0, 0, 0.08);
  font-size: calc(var(--tap) * 0.48);
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s, background 0.2s;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: #fde68a; box-shadow: inset 0 0 0 2px #f59e0b; }
/* Ton aus (.mute-btn, gesteuert von spg.js): stumm = grau */
.icon-btn.mute-btn[aria-pressed="true"] { background: #e2e8f0; box-shadow: inset 0 0 0 2px #cbd5e1; }

.big-btn {
  width: 100%;
  min-height: var(--big);
  padding: 0 18px;
  border: none;
  border-radius: 20px;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  box-shadow: 0 6px 14px color-mix(in srgb, var(--primary) 35%, transparent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  transition: transform 0.1s;
}
.big-btn:active { transform: scale(0.96); }
.big-btn.success { background: linear-gradient(90deg, var(--success-2), var(--success)); box-shadow: 0 6px 14px rgba(34, 197, 94, 0.35); }
.big-btn.plain { background: #f1f5f9; color: var(--ink); box-shadow: none; }
.big-btn.soft { background: var(--primary-soft); color: var(--primary-ink); box-shadow: inset 0 0 0 2px var(--primary-line); }

.row { display: flex; gap: var(--gap); }
.row > * { flex: 1; }
.stack { display: grid; gap: var(--gap); }

/* Auswahl-Kacheln (Anzahl, Schwierigkeit, Farbe ...) */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
.choice-btn {
  min-height: 84px;
  border: 3px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 1.2rem;
  font-weight: 700;
}
.choice-btn.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); }

/* ---------- Karten, Texte ---------- */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.muted { color: var(--muted); }
.section-label { text-align: left; font-weight: 700; color: var(--muted); margin: 20px 0 8px; font-size: 0.95rem; }

/* ---------- Dialoge ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay[hidden] { display: none; }
/* Die Kopfleiste bleibt über Dialogen bedienbar (🏠 🔊 ⛶ auch im Startbildschirm) */
body.game .topbar { position: relative; z-index: 2100; }
/* --spg-top = Unterkante der Kopfleiste, setzt spg.js (ein- oder zweireihig) */
body.game .overlay { padding-top: calc(var(--spg-top, calc(var(--tap) + 20px)) + 12px); }
body.game .dialog { max-height: calc(100dvh - var(--spg-top, calc(var(--tap) + 20px)) - 28px); }
.dialog {
  width: min(100%, 420px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  touch-action: pan-y;
  background: var(--surface);
  border-radius: 28px;
  padding: 22px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  animation: spg-pop-in 0.25s ease-out;
}
.dialog h2 { margin: 0 0 6px; font-size: 1.6rem; }
.dialog p { margin: 0 0 18px; color: var(--muted); font-weight: 500; }
.big-emoji { font-size: 56px; line-height: 1.1; margin-bottom: 6px; }
@keyframes spg-pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Hinweise, Konfetti ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3000;
  background: #1e293b;
  color: #fff;
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: 600;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast[hidden] { display: none; }
.confetti { position: fixed; inset: 0; z-index: 1500; pointer-events: none; }
.confetti[hidden] { display: none; }

.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
/* SPG-DESIGN:END */

    /* ---------- Ausmalbild ---------- */
    .cur {
      display: inline-block;
      width: 0.8em;
      height: 0.8em;
      margin-left: 8px;
      vertical-align: -0.05em;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(15, 23, 42, 0.25);
      transition: background 0.2s;
    }

    #stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--gap);
    }
    #paper-wrap { flex: 1 1 auto; min-height: 0; container-type: size; display: grid; place-items: center; }
    #paper {
      width: min(100cqw, 100cqh);
      height: min(100cqw, 100cqh);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow), 0 0 0 4px var(--primary-line);
    }
    #paper svg { display: block; width: 100%; height: 100%; }

    /* Malbereiche: dicke, weiche Linien, Antippen füllt die ganze Fläche */
    .pic .r {
      fill: #fff;
      stroke: #334155;
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
      cursor: pointer;
      transition: fill 0.25s;
    }
    .pic .r.pop { transform-box: fill-box; transform-origin: center; animation: fillpop 0.3s ease-out; }
    @keyframes fillpop { 40% { transform: scale(1.05); } }
    .pic .d { pointer-events: none; stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .pic .d .ink { fill: #334155; stroke: none; }
    .pic .d .white { fill: #fff; }

    /* Gemalte Striche: liegen direkt über ihrer Fläche und sind auf deren Form beschnitten,
       die Umrandung (.edge) wird darüber neu gezeichnet */
    .pic .strokes, .pic .edge { pointer-events: none; }
    .pic .strokes path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pic .edge { fill: none; stroke: #334155; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    #paper { touch-action: none; }

    /* Werkzeuge und Farbtöpfe */
    #side {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      background: var(--surface-2);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    #tools { display: flex; justify-content: center; gap: 12px; }
    .tool {
      width: var(--tap);
      height: var(--tap);
      border: none;
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 28px;
      line-height: 1;
      box-shadow: 0 0 0 2px var(--line), 0 2px 4px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .tool:active { transform: scale(0.9); }
    .tool.selected { background: var(--primary-soft); box-shadow: 0 0 0 4px var(--primary), 0 4px 10px rgba(0, 0, 0, 0.2); transform: scale(1.08); }

    #palette {
      display: grid;
      grid-template-columns: repeat(6, var(--tap));
      justify-content: center;
      gap: 8px;
    }
    .pot {
      width: var(--tap);
      height: var(--tap);
      border: none;
      border-radius: 50%;
      background: var(--c);
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.14), 0 2px 4px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .pot.white { box-shadow: inset 0 0 0 2px var(--line), inset 0 -6px 0 rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.15); }
    .pot:active { transform: scale(0.9); }
    .pot.selected { transform: scale(1.12); box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink), 0 4px 10px rgba(0, 0, 0, 0.25); }

    /* Querformat: Farbtöpfe rechts neben dem Bild */
    @media (orientation: landscape) {
      #stage { flex-direction: row; }
      #side { justify-content: center; }
      #tools { gap: 8px; }
      #palette { grid-template-columns: repeat(3, var(--tap)); }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #palette { grid-template-columns: repeat(4, var(--tap)); }
    }

    .icon-btn:disabled:active { transform: none; }

    /* Bildauswahl */
    #pic-grid { grid-template-columns: repeat(4, 1fr); }
    #pic-grid .choice-btn { min-height: 0; aspect-ratio: 1; padding: 4px; }
    #pic-grid svg { width: 100%; height: 100%; border-radius: 10px; }
    #pic-grid .pic .r, #pic-grid .pic .d, #pic-grid .pic .edge { stroke-width: 6; }
  </style>
</head>
<body class="game u6">

  <header class="topbar">
    <h1>🎨<span class="cur" id="cur" aria-hidden="true"></span></h1>
    <div class="actions">
      <a class="icon-btn home-btn" href="../" aria-label="Alle Spiele">🏠</a>
      <button class="icon-btn mute-btn" id="btn-mute" aria-label="Ton aus" aria-pressed="true">🔇</button>
      <button class="icon-btn" id="btn-new" aria-label="Bild wählen">🔄</button>
      <button class="icon-btn fs-btn" aria-label="Vollbild" aria-pressed="false">⛶</button>
    </div>
  </header>

  <main id="stage">
    <div id="paper-wrap"><div id="paper"></div></div>
    <div id="side">
      <div id="tools" role="radiogroup" aria-label="Werkzeug"></div>
      <div id="palette" role="radiogroup" aria-label="Farben"></div>
    </div>
  </main>

  <div class="gamebar">
    <button class="icon-btn" id="btn-undo" aria-label="Zurück" disabled>↩️</button>
  </div>

  <!-- Startbildschirm: Bild wählen (jedes Bild behält seine Farben) -->
  <div class="overlay" id="pics" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pics-title">
      <h2 id="pics-title">🖼️</h2>
      <div class="choice-grid" id="pic-grid"></div>
      <div class="row" style="margin-top:20px">
        <button class="big-btn plain" id="btn-clear" aria-label="Bild neu anmalen">🧽</button>
        <button class="big-btn" id="btn-close-pics" aria-label="Schließen">✖️</button>
      </div>
    </div>
  </div>


  <!-- Rückfrage bei Neustart -->
  <div class="overlay" id="confirm" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="big-emoji">🔄</div>
      <h2 id="confirm-title">Neu anmalen?</h2>
      <p>Das Bild wird wieder weiß.</p>
      <div class="row">
        <button class="big-btn plain" id="confirm-no" aria-label="Nein">✖️</button>
        <button class="big-btn success" id="confirm-yes" aria-label="Ja">✔️</button>
      </div>
    </div>
  </div>

  <!-- Fertig ausgemalt -->
  <div class="overlay" id="win" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="big-emoji">🎉🥳</div>
      <h2 id="win-title">Wunderschön!</h2>
      <p>Alles bunt!</p>
      <div class="row">
        <button class="big-btn plain" id="btn-look" aria-label="Anschauen">👀</button>
        <button class="big-btn success" id="btn-next" aria-label="Nächstes Bild">➡️</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="confetti" hidden></canvas>

  <script>
  'use strict';
/* SPG-JS:BEGIN */
// Gemeinsame Kopfleiste: 🏠 .home-btn, 🔊 .mute-btn, ⛶ .fs-btn (🔄 verdrahtet jedes Spiel selbst).
// Ton ist anfangs aus und gilt für alle Spiele (gleicher Speicher-Schlüssel). Sound.tone() fragt SPG.muted ab.
const SPG = {
  muted: (() => { try { return localStorage.getItem('spg-muted') !== '0'; } catch (e) { return true; } })(),
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('spg-muted', m ? '1' : '0'); } catch (e) {}
    this.render();
  },
  isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  toggleFullscreen() {
    const root = document.documentElement;
    try {
      if (this.isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else Promise.resolve((root.requestFullscreen || root.webkitRequestFullscreen).call(root)).catch(() => {});
    } catch (e) {}
  },
  render() {
    for (const b of document.querySelectorAll('.mute-btn')) {
      b.textContent = this.muted ? '🔇' : '🔊';
      b.setAttribute('aria-pressed', String(this.muted));
    }
    for (const b of document.querySelectorAll('.fs-btn')) {
      b.classList.toggle('active', this.isFullscreen());
      b.setAttribute('aria-pressed', String(this.isFullscreen()));
    }
  }
};
document.addEventListener('click', (e) => {
  if (!e.target.closest) return;
  if (e.target.closest('.mute-btn')) SPG.setMuted(!SPG.muted);
  if (e.target.closest('.fs-btn')) SPG.toggleFullscreen();
});
document.addEventListener('fullscreenchange', () => SPG.render());
document.addEventListener('webkitfullscreenchange', () => SPG.render());
window.addEventListener('storage', (e) => {
  if (e.key === 'spg-muted') { SPG.muted = e.newValue !== '0'; SPG.render(); }
});
// Zur Spieleübersicht nur online, die heruntergeladene Datei steht allein.
// Vollbild gibt es nicht überall (z. B. iPhone).
if (location.protocol === 'file:') for (const a of document.querySelectorAll('.home-btn')) a.hidden = true;
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {
  for (const b of document.querySelectorAll('.fs-btn')) b.hidden = true;
}
// Dialoge beginnen unter der Kopfleiste, die am schmalen Handy zweireihig ist.
const spgTop = document.querySelector('.topbar');
if (spgTop) {
  const setTop = () => document.documentElement.style.setProperty('--spg-top', Math.ceil(spgTop.getBoundingClientRect().bottom) + 'px');
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(spgTop);
  window.addEventListener('resize', setTop);
}
SPG.render();
/* SPG-JS:END */

  /* ===================================================================
     Töne (Web Audio, keine Dateien nötig)
     =================================================================== */
  const Sound = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return !!this.ctx;
    },
    tone(freq, start, dur, type = 'sine', vol = 0.3, endFreq) {
      if (SPG.muted) return;
      const t = this.ctx.currentTime + start;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur * 0.8);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    },
    pick(i) { if (this.init()) this.tone(NOTES[i % NOTES.length], 0, 0.12, 'triangle', 0.18); },
    // „Blubb“: Ton passend zur Farbe, gleitet nach oben
    fill(i) { if (this.init()) this.tone(NOTES[i % NOTES.length] * 0.75, 0, 0.22, 'sine', 0.32, NOTES[i % NOTES.length] * 1.5); },
    draw(i) { if (this.init()) this.tone(NOTES[i % NOTES.length], 0, 0.1, 'sine', 0.12); },
    undo() { if (this.init()) this.tone(600, 0, 0.15, 'sine', 0.2, 300); },
    win() {
      if (!this.init()) return;
      [261.63, 329.63, 392.0, 523.25, 659.25, 783.99].forEach((f, i) => this.tone(f, i * 0.1, 0.38, 'triangle', 0.28));
    }
  };
  // Pentatonik: jede Farbe hat ihren Ton, alles klingt zusammen schön

  /* ===================================================================

     =================================================================== */
  const Confetti = {
    canvas: document.getElementById('confetti'),
    raf: null,
    parts: [],
    start() {
      const c = this.canvas;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = innerWidth * dpr;
      c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
      c.hidden = false;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
      const n = Math.round(Math.min(160, innerWidth / 5));
      this.parts = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth,
        y: -Math.random() * innerHeight,
        s: Math.random() * 10 + 6,
        c: colors[(Math.random() * colors.length) | 0],
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 3 + 2.5,
        r: Math.random() * 360,
        vr: (Math.random() - 0.5) * 10
      }));
      const end = performance.now() + 7000;
      const loop = (now) => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of this.parts) {
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          if (p.y > innerHeight + 20 && now < end) p.y = -20;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
          ctx.restore();
        }
        if (now < end + 4000) this.raf = requestAnimationFrame(loop);
        else this.stop();
      };
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(loop);
    },
    stop() {
      cancelAnimationFrame(this.raf);
      this.canvas.hidden = true;
    }
  };

  /* ===================================================================
     Spiel
     =================================================================== */
  const $ = (id) => document.getElementById(id);
  const STORE = 'spg-ausmalbild-v1';

  function picMarkup(p) {
    return `<svg class="pic" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">${p.svg}</svg>`;
  }

  /* Striche gehören zu der Fläche, in der sie begonnen haben. Sie liegen direkt über ihr,
     beschnitten auf ihre Form; alle späteren Flächen liegen ohnehin darüber.
     So bleibt die Farbe genau im sichtbaren Teil der Fläche. */
  const SVGNS = 'http://www.w3.org/2000/svg';
  let clipSeq = 0;

  function strokeLayer(reg) {
    if (reg._strokes) return reg._strokes;
    const shape = reg.cloneNode(false);
    ['class', 'style', 'data-i'].forEach((a) => shape.removeAttribute(a));
    const clip = document.createElementNS(SVGNS, 'clipPath');
    clip.id = 'spg-clip-' + (++clipSeq);
    clip.appendChild(shape);
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'strokes');
    g.setAttribute('clip-path', `url(#${clip.id})`);
    const edge = shape.cloneNode(false);
    edge.setAttribute('class', 'edge');
    reg.after(clip, g, edge);
    reg._strokes = g;
    return g;
  }

  const r1 = (n) => Math.round(n * 10) / 10;
  function strokePath(p) {
    let d = `M${p[0]} ${p[1]}`;
    if (p.length <= 2) return d + 'h0.01';      // ein Punkt: runde Kappe malt einen Tupfen
    for (let i = 2; i < p.length - 2; i += 2) {
      d += `Q${p[i]} ${p[i + 1]} ${r1((p[i] + p[i + 2]) / 2)} ${r1((p[i + 1] + p[i + 3]) / 2)}`;
    }
    return d + `L${p[p.length - 2]} ${p[p.length - 1]}`;
  }

  function addStroke(regs, s) {
    const reg = regs[s.r];
    if (!reg) return null;
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('stroke', s.c);
    path.setAttribute('stroke-width', s.w);
    path.setAttribute('d', strokePath(s.p));
    strokeLayer(reg).appendChild(path);
    return path;
  }

  function validStroke(s) {
    return s && Number.isInteger(s.r) && typeof s.c === 'string' && typeof s.w === 'number' &&
      Array.isArray(s.p) && s.p.length >= 2 && s.p.every((n) => typeof n === 'number');
  }

  class ColoringGame {
    constructor() {
      this.paper = $('paper');
      this.pic = 0;
      this.color = 0;
      this.tool = 1;            // Pinsel
      this.fills = {};          // Bild-ID → Farben der Flächen
      this.strokes = {};        // Bild-ID → gemalte Striche {r: Fläche, c: Farbe, w: Breite, p: [x, y, …]}
      this.stroke = null;       // Strich, der gerade gemalt wird
      this.won = {};            // Bild-ID → schon gefeiert
      this.history = [];        // für ↩️: [Fläche, vorherige Farbe] oder ['stroke']
      this.load();
      this.buildTools();
      this.buildPalette();
      this.bind();
      this.show(this.pic);
      this.openPics();
    }

    load() {
      try {
        const s = JSON.parse(localStorage.getItem(STORE) || '{}');
        if (Number.isInteger(s.pic) && PICTURES[s.pic]) this.pic = s.pic;
        if (Number.isInteger(s.color) && COLORS[s.color]) this.color = s.color;
        if (Number.isInteger(s.tool) && TOOLS[s.tool]) this.tool = s.tool;
        if (s.strokes && typeof s.strokes === 'object') {
          for (const [id, list] of Object.entries(s.strokes)) {
            if (Array.isArray(list)) this.strokes[id] = list.filter(validStroke);
          }
        }
        if (s.fills && typeof s.fills === 'object') this.fills = s.fills;
        if (s.won && typeof s.won === 'object') this.won = s.won;
      } catch (e) {}
    }

    save() {
      try {
        localStorage.setItem(STORE, JSON.stringify({ pic: this.pic, color: this.color, tool: this.tool, fills: this.fills, strokes: this.strokes, won: this.won }));
      } catch (e) {}
    }

    get regions() { return [...this.paper.querySelectorAll('.r')]; }
    get current() { return PICTURES[this.pic]; }

    colorsFor(p, n) {
      const saved = this.fills[p.id];
      return Array.from({ length: n }, (_, i) => (saved && typeof saved[i] === 'string' ? saved[i] : WHITE));
    }

    show(i) {
      this.endStroke();
      this.pic = i;
      this.history = [];
      this.paper.innerHTML = picMarkup(this.current);
      const regs = this.regions;
      const cols = this.colorsFor(this.current, regs.length);
      regs.forEach((el, k) => { el.dataset.i = k; el.style.fill = cols[k]; });
      this.fills[this.current.id] = cols;
      this.strokesFor(this.current).forEach((s) => addStroke(regs, s));
      this.paper.setAttribute('aria-label', this.current.name);
      this.updateUndo();
      this.save();
    }

    strokesFor(p) { return this.strokes[p.id] || (this.strokes[p.id] = []); }

    buildTools() {
      const box = $('tools');
      TOOLS.forEach((t, i) => {
        const b = document.createElement('button');
        b.className = 'tool';
        b.textContent = t.icon;
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-label', t.name);
        b.addEventListener('click', () => { this.pickTool(i); Sound.pick(i + 3); });
        box.appendChild(b);
      });
      this.pickTool(this.tool);
    }

    pickTool(i) {
      this.tool = i;
      [...$('tools').children].forEach((b, k) => {
        b.classList.toggle('selected', k === i);
        b.setAttribute('aria-checked', String(k === i));
      });
      this.save();
    }

    buildPalette() {
      const pal = $('palette');
      COLORS.forEach(([c, name], i) => {
        const b = document.createElement('button');
        b.className = 'pot' + (c === WHITE ? ' white' : '');
        b.style.setProperty('--c', c);
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-label', name);
        b.addEventListener('click', () => { this.pick(i); Sound.pick(i); });
        pal.appendChild(b);
      });
      this.pick(this.color);
    }

    pick(i) {
      this.color = i;
      [...$('palette').children].forEach((b, k) => {
        b.classList.toggle('selected', k === i);
        b.setAttribute('aria-checked', String(k === i));
      });
      $('cur').style.background = COLORS[i][0];
      this.save();
    }

    paint(el) {
      const k = Number(el.dataset.i);
      const cols = this.fills[this.current.id];
      const c = COLORS[this.color][0];
      el.classList.remove('pop');
      void el.getBBox();         // Animation neu starten
      el.classList.add('pop');
      Sound.fill(this.color);
      buzz(30);
      if (cols[k] === c) return;
      this.history.push([k, cols[k]]);
      if (this.history.length > 200) this.history.shift();
      cols[k] = c;
      el.style.fill = c;
      this.updateUndo();
      this.save();
      this.checkDone();
    }

    beginStroke(el, e) {
      const svg = el.ownerSVGElement;
      const ctm = svg.getScreenCTM();
      if (!ctm) return;
      const data = { r: Number(el.dataset.i), c: COLORS[this.color][0], w: TOOLS[this.tool].w, p: [] };
      this.stroke = { data, inv: ctm.inverse(), pointer: e.pointerId, path: null };
      this.extendStroke(e);
      this.stroke.path = addStroke(this.regions, data);
      try { this.paper.setPointerCapture(e.pointerId); } catch (err) {}
      Sound.draw(this.color);
    }

    extendStroke(e) {
      const st = this.stroke;
      const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(st.inv);
      const p = st.data.p;
      const x = r1(pt.x), y = r1(pt.y);
      // Nur Punkte mit etwas Abstand speichern, das hält die Striche klein
      if (p.length && Math.hypot(x - p[p.length - 2], y - p[p.length - 1]) < 2) return;
      p.push(x, y);
    }

    endStroke() {
      const st = this.stroke;
      if (!st) return;
      this.stroke = null;
      this.strokesFor(this.current).push(st.data);
      this.history.push(['stroke']);
      if (this.history.length > 200) this.history.shift();
      this.updateUndo();
      this.save();
      this.checkDone();
    }

    undo() {
      const last = this.history.pop();
      if (!last) return;
      if (last[0] === 'stroke') {
        const s = this.strokesFor(this.current).pop();
        const layer = s && this.regions[s.r] && this.regions[s.r]._strokes;
        if (layer && layer.lastChild) layer.lastChild.remove();
      } else {
        const [k, prev] = last;
        this.fills[this.current.id][k] = prev;
        const el = this.regions[k];
        if (el) el.style.fill = prev;
      }
      Sound.undo();
      this.updateUndo();
      this.save();
    }

    updateUndo() { $('btn-undo').disabled = this.history.length === 0; }

    hasColor() { return this.fills[this.current.id].some((c) => c !== WHITE) || this.strokesFor(this.current).length > 0; }

    clear() {
      delete this.fills[this.current.id];
      delete this.strokes[this.current.id];
      delete this.won[this.current.id];
      this.show(this.pic);
    }

    checkDone() {
      const id = this.current.id;
      if (this.won[id]) return;
      // Eine Fläche zählt als bunt, wenn sie gefüllt ist oder bunt bemalt wurde
      const painted = new Set(this.strokesFor(this.current).filter((s) => s.c !== WHITE).map((s) => s.r));
      if (this.fills[id].some((c, k) => c === WHITE && !painted.has(k))) return;
      this.won[id] = true;
      this.save();
      setTimeout(() => {
        Sound.win();
        buzz([60, 60, 120]);
        Confetti.start();
        setTimeout(() => ($('win').hidden = false), 700);
      }, 300);
    }

    openPics() {
      const grid = $('pic-grid');
      grid.innerHTML = '';
      PICTURES.forEach((p, i) => {
        const b = document.createElement('button');
        b.className = 'choice-btn' + (i === this.pic ? ' selected' : '');
        b.setAttribute('aria-label', p.name);
        b.innerHTML = picMarkup(p);
        const regs = b.querySelectorAll('.r');
        const cols = this.colorsFor(p, regs.length);
        regs.forEach((el, k) => (el.style.fill = cols[k]));
        this.strokesFor(p).forEach((s) => addStroke(regs, s));
        b.addEventListener('click', () => { $('pics').hidden = true; Sound.pick(i); this.show(i); });
        grid.appendChild(b);
      });
      $('btn-clear').hidden = !this.hasColor();
      $('pics').hidden = false;
    }

    ask(onYes) {
      const dlg = $('confirm');
      dlg.hidden = false;
      const done = (yes) => {
        dlg.hidden = true;
        $('confirm-yes').onclick = $('confirm-no').onclick = null;
        if (yes) onYes();
      };
      $('confirm-yes').onclick = () => done(true);
      $('confirm-no').onclick = () => done(false);
    }

    bind() {
      // 🪣 füllt beim Antippen sofort (pointerdown statt click, fühlt sich direkter an),
      // ✏️/🖌️ malen mit Finger oder Stift, nur in der Fläche, in der der Strich beginnt
      this.paper.addEventListener('pointerdown', (e) => {
        const el = e.target.closest && e.target.closest('.r');
        if (!el || this.stroke) return;
        if (!TOOLS[this.tool].w) { this.paint(el); return; }
        e.preventDefault();
        this.beginStroke(el, e);
      });
      this.paper.addEventListener('pointermove', (e) => {
        if (!this.stroke || e.pointerId !== this.stroke.pointer) return;
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
        (evs.length ? evs : [e]).forEach((ev) => this.extendStroke(ev));
        this.stroke.path.setAttribute('d', strokePath(this.stroke.data.p));
      });
      const finish = (e) => { if (this.stroke && e.pointerId === this.stroke.pointer) this.endStroke(); };
      this.paper.addEventListener('pointerup', finish);
      this.paper.addEventListener('pointercancel', finish);
      this.paper.addEventListener('lostpointercapture', finish);

      $('btn-undo').addEventListener('click', () => this.undo());
      $('btn-new').addEventListener('click', () => this.openPics());
      $('btn-close-pics').addEventListener('click', () => ($('pics').hidden = true));
      $('pics').addEventListener('click', (e) => { if (e.target.id === 'pics') $('pics').hidden = true; });

      $('btn-clear').addEventListener('click', () => {
        $('pics').hidden = true;
        if (this.hasColor()) this.ask(() => this.clear());
      });

      $('btn-look').addEventListener('click', () => { $('win').hidden = true; Confetti.stop(); });
      $('btn-next').addEventListener('click', () => {
        $('win').hidden = true;
        Confetti.stop();
        // Nächstes Bild, das noch nicht fertig ist (sonst einfach das nächste)
        let next = (this.pic + 1) % PICTURES.length;
        for (let s = 1; s <= PICTURES.length; s++) {
          const j = (this.pic + s) % PICTURES.length;
          if (!this.won[PICTURES[j].id]) { next = j; break; }
        }
        this.show(next);
      });

      // Kein Kontextmenü bei langem Drücken
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      // Drehen braucht nichts: das Bild ist ein SVG und wächst mit, die Farben bleiben.
    }

  }

  window.addEventListener('DOMContentLoaded', () => { window.game = new ColoringGame(); });
  </script>
</body>
</html>
