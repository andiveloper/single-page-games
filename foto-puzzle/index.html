<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fed7aa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kinder Foto-Puzzle 🧩</title>

  <style>
/* SPG-DESIGN:BEGIN */
/* Single-Page Games: gemeinsame Designsprache v1
   Quelle: design/spg.css. Nicht in den Spielen von Hand ändern,
   sondern hier ändern und `node tools/design.mjs --write` ausführen. */
:root {
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ink: #1e293b;
  --muted: #64748b;
  --surface: #ffffff;
  --surface-2: rgba(255, 255, 255, 0.88);
  --line: #e2e8f0;
  --success: #22c55e;
  --success-2: #34d399;
  --danger: #ef4444;
  --radius: 24px;
  --radius-sm: 18px;
  --tap: 56px;           /* Mindestgröße für Tasten (Kinderfinger) */
  --big: 64px;           /* Höhe großer Knöpfe */
  --gap: 12px;
  --fs-title: clamp(1.25rem, 5vw, 1.8rem);
  --fs-text: 1.05rem;
}
@media (max-width: 360px) { :root { --tap: 50px; --big: 58px; --gap: 8px; } }
@media (min-width: 700px) and (min-height: 700px) { :root { --tap: 68px; --big: 72px; --gap: 16px; } }

/* Kategorie-Farben: .u6 = bis 6 Jahre (warm), .ue6 = ab 6 / Erwachsene (kühl).
   Auf <body> setzen; funktioniert auch auf einzelnen Karten. */
:root, .u6 {
  --primary: #f97316;
  --primary-2: #f59e0b;
  --primary-ink: #c2410c;
  --primary-soft: #fff7ed;
  --primary-line: #fed7aa;
  --bg: linear-gradient(180deg, #fef3c7 0%, #ffedd5 45%, #ffe4e6 100%);
  --shadow: 0 4px 14px rgba(194, 65, 12, 0.12);
}
.ue6 {
  --primary: #6366f1;
  --primary-2: #8b5cf6;
  --primary-ink: #4338ca;
  --primary-soft: #eef2ff;
  --primary-line: #c7d2fe;
  --bg: linear-gradient(180deg, #e0e7ff 0%, #ede9fe 50%, #fae8ff 100%);
  --shadow: 0 4px 14px rgba(67, 56, 202, 0.14);
}

/* ---------- Grundlage ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-text);
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  background-attachment: fixed;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }

/* Vollbild-Spielseite: kein Scrollen, Zoomen, Markieren oder Pull-to-Refresh */
html:has(> body.game) { height: 100%; overflow: hidden; overscroll-behavior: none; }
body.game {
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* ---------- Kopfleiste ---------- */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  margin: 8px 8px 0;
  padding: 6px 6px 6px 14px;
  background: var(--surface-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.topbar h1 {
  margin: 0;
  min-width: 0;
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .actions { display: flex; gap: 8px; flex: none; }
/* Spielknöpfe (Zurück, Flagge, Pause …) gehören nicht in die Kopfleiste, sondern in die Leiste unter dem Spielfeld */
.gamebar { flex: none; display: flex; justify-content: center; gap: 12px; margin: 0 8px 8px; }
.gamebar .icon-btn { width: var(--big); height: var(--big); font-size: calc(var(--big) * 0.46); }
.icon-btn:disabled { opacity: 0.4; cursor: default; }
@media (min-width: 700px) and (min-height: 700px) { .topbar { margin: 12px 12px 0; padding: 8px 8px 8px 20px; } }
/* Schmales Handy (hoch): die Knöpfe bekommen oben eine eigene Reihe, darunter steht der Spielstand (h1)
   in voller Breite. So verschwinden Punkte, Leben usw. nie hinter den Knöpfen. Quer und am Tablet: eine Reihe. */
@media (max-width: 599px) {
  .topbar { flex-wrap: wrap; justify-content: center; row-gap: 2px; padding: 6px; }
  .topbar .actions { order: -1; width: 100%; justify-content: space-between; }
  .topbar h1 { flex: 1 1 100%; padding: 0 8px 2px; text-align: center; justify-content: center; line-height: 1.35; }
}

/* ---------- Knöpfe ---------- */
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  flex: none;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  box-shadow: inset 0 0 0 2px var(--primary-line), 0 2px 4px rgba(0, 0, 0, 0.08);
  font-size: calc(var(--tap) * 0.48);
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s, background 0.2s;
}
.icon-btn:active { transform: scale(0.9); }
.icon-btn.active { background: #fde68a; box-shadow: inset 0 0 0 2px #f59e0b; }
/* Ton aus (.mute-btn, gesteuert von spg.js): stumm = grau */
.icon-btn.mute-btn[aria-pressed="true"] { background: #e2e8f0; box-shadow: inset 0 0 0 2px #cbd5e1; }

.big-btn {
  width: 100%;
  min-height: var(--big);
  padding: 0 18px;
  border: none;
  border-radius: 20px;
  font-size: 1.3rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  box-shadow: 0 6px 14px color-mix(in srgb, var(--primary) 35%, transparent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  transition: transform 0.1s;
}
.big-btn:active { transform: scale(0.96); }
.big-btn.success { background: linear-gradient(90deg, var(--success-2), var(--success)); box-shadow: 0 6px 14px rgba(34, 197, 94, 0.35); }
.big-btn.plain { background: #f1f5f9; color: var(--ink); box-shadow: none; }
.big-btn.soft { background: var(--primary-soft); color: var(--primary-ink); box-shadow: inset 0 0 0 2px var(--primary-line); }

.row { display: flex; gap: var(--gap); }
.row > * { flex: 1; }
.stack { display: grid; gap: var(--gap); }

/* Auswahl-Kacheln (Anzahl, Schwierigkeit, Farbe ...) */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
.choice-btn {
  min-height: 84px;
  border: 3px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 1.2rem;
  font-weight: 700;
}
.choice-btn.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); }

/* ---------- Karten, Texte ---------- */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.muted { color: var(--muted); }
.section-label { text-align: left; font-weight: 700; color: var(--muted); margin: 20px 0 8px; font-size: 0.95rem; }

/* ---------- Dialoge ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.overlay[hidden] { display: none; }
/* Die Kopfleiste bleibt über Dialogen bedienbar (🏠 🔊 ⛶ auch im Startbildschirm) */
body.game .topbar { position: relative; z-index: 2100; }
/* --spg-top = Unterkante der Kopfleiste, setzt spg.js (ein- oder zweireihig) */
body.game .overlay { padding-top: calc(var(--spg-top, calc(var(--tap) + 20px)) + 12px); }
body.game .dialog { max-height: calc(100dvh - var(--spg-top, calc(var(--tap) + 20px)) - 28px); }
.dialog {
  width: min(100%, 420px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  touch-action: pan-y;
  background: var(--surface);
  border-radius: 28px;
  padding: 22px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  animation: spg-pop-in 0.25s ease-out;
}
.dialog h2 { margin: 0 0 6px; font-size: 1.6rem; }
.dialog p { margin: 0 0 18px; color: var(--muted); font-weight: 500; }
.big-emoji { font-size: 56px; line-height: 1.1; margin-bottom: 6px; }
@keyframes spg-pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Hinweise, Konfetti ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 3000;
  background: #1e293b;
  color: #fff;
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: 600;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast[hidden] { display: none; }
.confetti { position: fixed; inset: 0; z-index: 1500; pointer-events: none; }
.confetti[hidden] { display: none; }

.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
/* SPG-DESIGN:END */

    /* ---------- Puzzle ---------- */
    .progress { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
    .progress i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary-line); transition: background 0.3s, transform 0.3s; }
    .progress i.on { background: var(--success); transform: scale(1.2); }

    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      padding: var(--gap);
    }
    #board-wrap { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; }
    #board {
      position: relative;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.55);
      outline: 4px dashed rgba(251, 191, 36, 0.9);
      outline-offset: 4px;
    }
    #board canvas { display: block; border-radius: 12px; }
    #tray {
      flex: 1 1 0;
      min-height: 150px;
      background: var(--surface-2);
      border-radius: 28px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.06), var(--shadow);
      display: grid;
      place-items: center;
    }

    /* Querformat (Tablet quer, Handy quer): Ablage rechts neben dem Spielfeld */
    @media (orientation: landscape) {
      #stage { flex-direction: row; }
      #tray { min-height: 0; min-width: 160px; }
    }
    @media (max-width: 520px) { .progress { margin-left: 2px; } .progress i { width: 9px; height: 9px; } }
    @media (max-width: 370px) { .progress { display: none; } }

    .piece {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 20;
      touch-action: none;
      cursor: grab;
      will-change: translate, scale;
      transition: scale 0.18s ease-out, rotate 0.18s ease-out;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
    }
    .piece.returning { transition: translate 0.3s ease-out, scale 0.3s ease-out, rotate 0.3s ease-out; }
    .piece.dragging { cursor: grabbing; filter: drop-shadow(0 12px 16px rgba(0,0,0,0.35)); }
    .piece.locked {
      z-index: 5 !important;
      cursor: default;
      filter: none;
      transition: translate 0.15s ease-out, scale 0.15s, rotate 0.15s;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop { 0% { scale: 1; } 40% { scale: 1.12; } 100% { scale: 1; } }

    /* Startmenü: erst Foto, dann Anzahl Teile */
    .menu-btn { min-height: 96px; font-size: 1.45rem; border-radius: 24px; }
    #preview { display: block; width: auto; height: auto; max-width: 100%; max-height: 22dvh; margin: 0 auto 14px; border-radius: 16px; box-shadow: var(--shadow); }
    #count-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    #count-grid .choice-btn { min-height: 104px; font-size: 1.6rem; }
    .choice-btn svg { width: 48px; height: 36px; }
  </style>
</head>
<body class="game u6">

  <header class="topbar">
    <h1>🧩 <span class="title-text">Puzzle</span><span class="progress" id="progress" aria-hidden="true"></span></h1>
    <div class="actions">
      <a class="icon-btn home-btn" href="../" aria-label="Alle Spiele">🏠</a>
      <button class="icon-btn mute-btn" id="btn-mute" aria-label="Ton aus" aria-pressed="true">🔇</button>
      <button class="icon-btn" id="btn-new" aria-label="Neues Puzzle">🔄</button>
      <button class="icon-btn fs-btn" aria-label="Vollbild" aria-pressed="false">⛶</button>
    </div>
  </header>

  <main id="stage">
    <div id="board-wrap">
      <div id="board"><canvas id="board-canvas"></canvas></div>
    </div>
    <div id="tray" aria-label="Ablage für Puzzleteile"></div>
  </main>

  <div class="gamebar">
    <button class="icon-btn" id="btn-hint" aria-label="Vorlage anzeigen" aria-pressed="false">👁️</button>
  </div>

  <!-- Startmenü: 1. Foto wählen, 2. Anzahl Teile -->
  <div class="overlay" id="menu">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div id="step-photo">
        <div class="big-emoji">🧩</div>
        <h2 id="menu-title">Puzzle</h2>
        <div class="stack" style="margin-top:16px">
          <label class="big-btn success menu-btn" for="file-input">📷 Eigenes Foto</label>
          <button class="big-btn soft menu-btn" id="btn-dino">🦕 Beispielfoto</button>
        </div>
        <input type="file" id="file-input" class="visually-hidden" accept="image/*">
        <button class="big-btn plain" id="btn-close-menu" aria-label="Schließen" style="margin-top:20px">✖️</button>
      </div>
      <div id="step-count" hidden>
        <canvas id="preview" aria-hidden="true"></canvas>
        <h2>Wie viele Teile?</h2>
        <div class="choice-grid" id="count-grid" style="margin-top:14px"></div>
        <button class="big-btn plain" id="btn-back" aria-label="Zurück" style="margin-top:20px">⬅️</button>
      </div>
    </div>
  </div>

  <!-- Rückfrage bei Neustart -->
  <div class="overlay" id="confirm" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="big-emoji">🔄</div>
      <h2 id="confirm-title">Neu anfangen?</h2>
      <p>Das Puzzle wird neu gemischt.</p>
      <div class="row">
        <button class="big-btn plain" id="confirm-no" aria-label="Nein">✖️</button>
        <button class="big-btn success" id="confirm-yes" aria-label="Ja">✔️</button>
      </div>
    </div>
  </div>

  <!-- Gewonnen -->
  <div class="overlay" id="win" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="big-emoji">🎉🥳</div>
      <h2 id="win-title">Super gemacht!</h2>
      <p>Du hast das Puzzle geschafft!</p>
      <div class="row">
        <button class="big-btn plain" id="btn-win-menu" aria-label="Neues Bild">🖼️</button>
        <button class="big-btn" id="btn-again">Nochmal 🚀</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" class="confetti" hidden></canvas>
  <div id="toast" class="toast" hidden></div>

  <script>
  'use strict';
/* SPG-JS:BEGIN */
// Gemeinsame Kopfleiste: 🏠 .home-btn, 🔊 .mute-btn, ⛶ .fs-btn (🔄 verdrahtet jedes Spiel selbst).
// Ton ist anfangs aus und gilt für alle Spiele (gleicher Speicher-Schlüssel). Sound.tone() fragt SPG.muted ab.
const SPG = {
  muted: (() => { try { return localStorage.getItem('spg-muted') !== '0'; } catch (e) { return true; } })(),
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('spg-muted', m ? '1' : '0'); } catch (e) {}
    this.render();
  },
  isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  toggleFullscreen() {
    const root = document.documentElement;
    try {
      if (this.isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else Promise.resolve((root.requestFullscreen || root.webkitRequestFullscreen).call(root)).catch(() => {});
    } catch (e) {}
  },
  render() {
    for (const b of document.querySelectorAll('.mute-btn')) {
      b.textContent = this.muted ? '🔇' : '🔊';
      b.setAttribute('aria-pressed', String(this.muted));
    }
    for (const b of document.querySelectorAll('.fs-btn')) {
      b.classList.toggle('active', this.isFullscreen());
      b.setAttribute('aria-pressed', String(this.isFullscreen()));
    }
  }
};
document.addEventListener('click', (e) => {
  if (!e.target.closest) return;
  if (e.target.closest('.mute-btn')) SPG.setMuted(!SPG.muted);
  if (e.target.closest('.fs-btn')) SPG.toggleFullscreen();
});
document.addEventListener('fullscreenchange', () => SPG.render());
document.addEventListener('webkitfullscreenchange', () => SPG.render());
window.addEventListener('storage', (e) => {
  if (e.key === 'spg-muted') { SPG.muted = e.newValue !== '0'; SPG.render(); }
});
// Zur Spieleübersicht nur online, die heruntergeladene Datei steht allein.
// Vollbild gibt es nicht überall (z. B. iPhone).
if (location.protocol === 'file:') for (const a of document.querySelectorAll('.home-btn')) a.hidden = true;
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) {
  for (const b of document.querySelectorAll('.fs-btn')) b.hidden = true;
}
// Dialoge beginnen unter der Kopfleiste, die am schmalen Handy zweireihig ist.
const spgTop = document.querySelector('.topbar');
if (spgTop) {
  const setTop = () => document.documentElement.style.setProperty('--spg-top', Math.ceil(spgTop.getBoundingClientRect().bottom) + 'px');
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(spgTop);
  window.addEventListener('resize', setTop);
}
SPG.render();
/* SPG-JS:END */

  /* ===================================================================
     Töne (Web Audio, keine Dateien nötig)
     =================================================================== */
  const Sound = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    tone(freq, start, dur, type = 'sine', vol = 0.3, endFreq) {
      if (SPG.muted) return;
      const t = this.ctx.currentTime + start;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur * 0.8);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    },
    pick() { this.init(); if (this.ctx) this.tone(500, 0, 0.06, 'sine', 0.12, 650); },
    snap() { this.init(); if (this.ctx) this.tone(320, 0, 0.12, 'sine', 0.35, 880); },
    win() {
      this.init();
      if (!this.ctx) return;
      [261.63, 329.63, 392.0, 523.25, 659.25, 783.99].forEach((f, i) => this.tone(f, i * 0.1, 0.38, 'triangle', 0.28));
    }
  };

  function buzz(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }

  /* ===================================================================
     Konfetti
     =================================================================== */
  const Confetti = {
    canvas: document.getElementById('confetti'),
    raf: null,
    parts: [],
    start() {
      const c = this.canvas;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      c.width = innerWidth * dpr;
      c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px';
      c.style.height = innerHeight + 'px';
      c.hidden = false;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
      const n = Math.round(Math.min(160, innerWidth / 5));
      this.parts = Array.from({ length: n }, () => ({
        x: Math.random() * innerWidth,
        y: -Math.random() * innerHeight,
        s: Math.random() * 10 + 6,
        c: colors[(Math.random() * colors.length) | 0],
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 3 + 2.5,
        r: Math.random() * 360,
        vr: (Math.random() - 0.5) * 10
      }));
      const end = performance.now() + 7000;
      const loop = (now) => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of this.parts) {
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          if (p.y > innerHeight + 20 && now < end) p.y = -20;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.r * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
          ctx.restore();
        }
        if (now < end + 4000) this.raf = requestAnimationFrame(loop);
        else this.stop();
      };
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(loop);
    },
    stop() {
      cancelAnimationFrame(this.raf);
      this.canvas.hidden = true;
    }
  };

  /* ===================================================================
     Hilfsfunktionen
     =================================================================== */
  const $ = (id) => document.getElementById(id);
  const MAX_SRC = 1600;              // große Handyfotos verkleinern (Speicher, Tempo)
  const COUNTS = [4, 6, 9, 12];

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  /* Bild in eine Canvas kopieren: verkleinert und auf ein kindgerechtes
     Seitenverhältnis (zwischen 3:4 und 4:3) mittig zugeschnitten. */
  function prepareSource(img) {
    const w = img.naturalWidth || img.width || 800;
    const h = img.naturalHeight || img.height || 600;
    let sw = w, sh = h;
    const minA = 3 / 4, maxA = 4 / 3;
    if (sw / sh > maxA) sw = sh * maxA;
    if (sw / sh < minA) sh = sw / minA;
    const sx = (w - sw) / 2, sy = (h - sh) / 2;
    const scale = Math.min(1, MAX_SRC / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.round(sw * scale);
    c.height = Math.round(sh * scale);
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return c;
  }

  /* Raster wählen, dessen Teile möglichst quadratisch sind */
  function gridFor(count, aspect) {
    const pairs = [];
    for (let c = 1; c <= count; c++) if (count % c === 0) pairs.push([c, count / c]);
    let best = pairs[0], bestErr = Infinity;
    for (const [c, r] of pairs) {
      if (c === 1 || r === 1) continue;
      const err = Math.abs(Math.log((aspect / c) * r));   // Teil-Seitenverhältnis vs. 1
      if (err < bestErr) { bestErr = err; best = [c, r]; }
    }
    return { cols: best[0], rows: best[1] };
  }

  function gridIcon(cols, rows) {
    const W = 34, H = 26, gw = W / cols, gh = H / rows;
    let s = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        s += `<rect x="${c * gw + 1}" y="${r * gh + 1}" width="${gw - 2}" height="${gh - 2}" rx="2" fill="currentColor" opacity="${(r + c) % 2 ? 0.55 : 0.9}"/>`;
    return s + '</svg>';
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 3500);
  }

  /* ===================================================================
     Puzzleteil-Form
     Klassische Nase mit Hals. Die Nase ist auf allen Kanten gleich groß
     (bezogen auf die kürzere Teilseite), egal wie lang die Kante ist.
     =================================================================== */
  // Normierte Kurve: u = Position entlang der Kante (um 0.5 zentriert), v = nach außen
  const TAB_CURVE = [
    // [cp1u, cp1v, cp2u, cp2v, u, v]
    [0.40, 0.00, 0.42, 0.20, 0.39, 0.40],
    [0.35, 0.72, 0.38, 1.00, 0.50, 1.00],
    [0.62, 1.00, 0.65, 0.72, 0.61, 0.40],
    [0.58, 0.20, 0.60, 0.00, 0.66, 0.00]
  ];

  function edge(ctx, x1, y1, x2, y2, dir, size, depth) {
    if (!dir) { ctx.lineTo(x2, y2); return; }
    const len = Math.hypot(x2 - x1, y2 - y1);
    const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    // Außen-Normale (Pfad läuft im Uhrzeigersinn → links von der Laufrichtung ist außen)
    const nx = uy * dir, ny = -ux * dir;
    const P = (u, v) => {
      const along = len / 2 + (u - 0.5) * size;
      return [x1 + ux * along + nx * v * depth, y1 + uy * along + ny * v * depth];
    };
    const start = P(0.34, 0);
    ctx.lineTo(start[0], start[1]);
    for (const [a, b, c, d, e, f] of TAB_CURVE) {
      const p1 = P(a, b), p2 = P(c, d), p3 = P(e, f);
      ctx.bezierCurveTo(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]);
    }
    ctx.lineTo(x2, y2);
  }

  function piecePath(ctx, x, y, w, h, t, size, depth) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    edge(ctx, x, y, x + w, y, t.top, size, depth);
    edge(ctx, x + w, y, x + w, y + h, t.right, size, depth);
    edge(ctx, x + w, y + h, x, y + h, t.bottom, size, depth);
    edge(ctx, x, y + h, x, y, t.left, size, depth);
    ctx.closePath();
  }

  /* ===================================================================
     Spiel
     =================================================================== */
  class PuzzleGame {
    constructor() {
      this.stage = $('stage');
      this.boardWrap = $('board-wrap');
      this.board = $('board');
      this.boardCanvas = $('board-canvas');
      this.tray = $('tray');
      this.progressEl = $('progress');

      this.source = null;
      this.count = 6;
      this.cols = 3;
      this.rows = 2;
      this.tabs = null;
      this.pieces = [];
      this.showHint = false;
      this.won = false;
      this.zTop = 20;
      this.lastSize = '';
      this.pending = null;               // im Menü gewähltes Bild, noch nicht gestartet

      this.bindUI();
      this.buildCountButtons();
      this.openMenu();
    }

    /* ---------- Oberfläche ---------- */
    bindUI() {
      $('btn-hint').addEventListener('click', () => {
        this.showHint = !this.showHint;
        $('btn-hint').classList.toggle('active', this.showHint);
        $('btn-hint').setAttribute('aria-pressed', String(this.showHint));
        this.drawBoard();
      });

      $('btn-new').addEventListener('click', () => {
        if (this.hasProgress()) this.ask(() => this.openMenu());
        else this.openMenu();
      });

      const menu = $('menu');
      $('btn-close-menu').addEventListener('click', () => this.closeMenu());
      menu.addEventListener('click', (e) => { if (e.target === menu) this.closeMenu(); });
      $('btn-back').addEventListener('click', () => this.showStep('photo'));

      $('file-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';                 // dasselbe Foto erneut wählbar
        if (!file) return;
        const url = URL.createObjectURL(file);
        this.chooseImage(url).finally(() => URL.revokeObjectURL(url));
      });

      $('btn-dino').addEventListener('click', () => { Sound.pick(); this.chooseImage(DINO_SVG); });

      $('btn-win-menu').addEventListener('click', () => {
        $('win').hidden = true;
        Confetti.stop();
        this.openMenu();
      });

      $('btn-again').addEventListener('click', () => {
        $('win').hidden = true;
        Confetti.stop();
        this.newGame();
      });

      // Kein Kontextmenü bei langem Drücken
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      // Drehen / Größe ändern (verzögert, damit es nicht ständig neu rechnet)
      let t;
      const onResize = () => { clearTimeout(t); t = setTimeout(() => this.relayout(), 180); };
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', onResize);
    }

    buildCountButtons() {
      const grid = $('count-grid');
      grid.innerHTML = '';
      for (const n of COUNTS) {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.dataset.count = n;
        b.setAttribute('aria-label', `${n} Teile`);
        grid.appendChild(b);
        b.addEventListener('click', () => {
          if (!this.pending) return;
          Sound.pick();
          this.count = n;
          this.source = this.pending;
          this.pending = null;
          $('menu').hidden = true;
          this.newGame();
        });
      }
    }

    refreshCountButtons() {
      const src = this.pending || this.source;
      const aspect = src ? src.width / src.height : 4 / 3;
      for (const b of document.querySelectorAll('.choice-btn')) {
        const n = Number(b.dataset.count);
        const g = gridFor(n, aspect);
        b.innerHTML = gridIcon(g.cols, g.rows) + `<span>${n}</span>`;
        b.classList.toggle('selected', n === this.count);
      }
    }

    /* ---------- Startmenü ---------- */
    openMenu() {
      this.pending = null;
      this.showStep('photo');
      $('btn-close-menu').hidden = !this.source;   // ohne laufendes Puzzle gibt es nichts zum Zurückkehren
      $('menu').hidden = false;
    }

    closeMenu() {
      if (!this.source) return;
      this.pending = null;
      $('menu').hidden = true;
    }

    showStep(step) {
      $('step-photo').hidden = step !== 'photo';
      $('step-count').hidden = step !== 'count';
      if (step === 'count') {
        this.refreshCountButtons();
        const p = $('preview');
        p.width = this.pending.width;
        p.height = this.pending.height;
        p.getContext('2d').drawImage(this.pending, 0, 0);
      }
    }

    ask(onYes) {
      const dlg = $('confirm');
      dlg.hidden = false;
      const done = (yes) => {
        dlg.hidden = true;
        $('confirm-yes').onclick = $('confirm-no').onclick = null;
        if (yes) onYes();
      };
      $('confirm-yes').onclick = () => done(true);
      $('confirm-no').onclick = () => done(false);
    }

    hasProgress() {
      return !this.won && this.pieces.some((p) => p.locked || p.inTray === false);
    }

    /* ---------- Bild laden ---------- */
    async chooseImage(src) {
      try {
        const img = await loadImage(src);
        this.pending = prepareSource(img);
        this.showStep('count');
      } catch (e) {
        toast('Dieses Foto kann der Browser leider nicht öffnen. Bitte ein JPG oder PNG wählen.');
      }
    }

    /* ---------- Spielstart ---------- */
    newGame() {
      if (!this.source) return;
      Confetti.stop();
      $('win').hidden = true;
      this.won = false;

      const g = gridFor(this.count, this.source.width / this.source.height);
      this.cols = g.cols;
      this.rows = g.rows;

      // Zufällige Nasen: +1 = nach außen, -1 = nach innen
      const rnd = () => (Math.random() < 0.5 ? 1 : -1);
      this.hTabs = Array.from({ length: this.rows - 1 }, () => Array.from({ length: this.cols }, rnd));
      this.vTabs = Array.from({ length: this.rows }, () => Array.from({ length: this.cols - 1 }, rnd));

      this.build(null);
    }

    tabsFor(r, c) {
      return {
        top: r === 0 ? 0 : -this.hTabs[r - 1][c],
        right: c === this.cols - 1 ? 0 : this.vTabs[r][c],
        bottom: r === this.rows - 1 ? 0 : this.hTabs[r][c],
        left: c === 0 ? 0 : -this.vTabs[r][c - 1]
      };
    }

    /* Größen berechnen. Nach dem Drehen werden die Teile neu gezeichnet,
       fertig gelegte bleiben liegen, lose kommen zurück in die Ablage. */
    relayout() {
      const key = `${innerWidth}x${innerHeight}`;
      if (key === this.lastSize || !this.pieces.length) return;
      const lockedSet = new Set(this.pieces.filter((p) => p.locked).map((p) => p.r + ',' + p.c));
      this.build(lockedSet);
    }

    measure() {
      this.lastSize = `${innerWidth}x${innerHeight}`;
      const aspect = this.source.width / this.source.height;
      const pad = 14;   // Platz für Rahmen und Nasen

      // Das Spielfeld bekommt so viel Platz wie das Bild braucht (max. 64 %),
      // der Rest geht an die Ablage – so werden die Teile dort größer.
      const st = this.stage.getBoundingClientRect();
      const cs = getComputedStyle(this.stage);
      const gap = parseFloat(cs.gap) || 10;
      const innerW = st.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const innerH = st.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if (cs.flexDirection === 'row') {
        const needW = (innerH - pad * 2) * aspect + pad * 2;
        this.boardWrap.style.flex = `0 0 ${Math.floor(Math.min(needW, (innerW - gap) * 0.64))}px`;
      } else {
        const needH = (innerW - pad * 2) / aspect + pad * 2;
        this.boardWrap.style.flex = `0 0 ${Math.floor(Math.min(needH, (innerH - gap) * 0.64))}px`;
      }
      const wrap = this.boardWrap.getBoundingClientRect();

      let bw = Math.max(120, wrap.width - pad * 2);
      let bh = bw / aspect;
      const maxH = Math.max(100, wrap.height - pad * 2);
      if (bh > maxH) { bh = maxH; bw = bh * aspect; }
      bw = Math.min(bw, 1000);
      bh = bw / aspect;

      this.bw = Math.floor(bw);
      this.bh = Math.floor(bh);
      this.pw = this.bw / this.cols;
      this.ph = this.bh / this.rows;
      this.tabSize = Math.min(this.pw, this.ph);         // Breite der Nase (normiert)
      this.tabDepth = this.tabSize * 0.22;               // wie weit sie herausragt
      this.margin = Math.ceil(this.tabDepth + 4);        // Rand in der Teil-Canvas
      this.dpr = Math.min(window.devicePixelRatio || 1, 3);

      this.board.style.width = this.bw + 'px';
      this.board.style.height = this.bh + 'px';
    }

    rectIn(el) {
      const s = this.stage.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
    }

    build(lockedSet) {
      for (const p of this.pieces) p.el.remove();
      this.pieces = [];
      this.zTop = 20;

      this.measure();
      this.drawBoard();

      const boardR = this.rectIn(this.board);
      const m = this.margin;
      const cw = this.pw + 2 * m;
      const ch = this.ph + 2 * m;

      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          const t = this.tabsFor(r, c);
          const el = document.createElement('canvas');
          el.className = 'piece';
          el.width = Math.round(cw * this.dpr);
          el.height = Math.round(ch * this.dpr);
          el.style.width = cw + 'px';
          el.style.height = ch + 'px';

          const ctx = el.getContext('2d');
          ctx.scale(this.dpr, this.dpr);
          ctx.save();
          piecePath(ctx, m, m, this.pw, this.ph, t, this.tabSize, this.tabDepth);
          ctx.clip();
          // Ganzes Bild verschoben zeichnen, der Clip schneidet das Teil aus
          ctx.drawImage(this.source, m - c * this.pw, m - r * this.ph, this.bw, this.bh);
          ctx.restore();

          piecePath(ctx, m, m, this.pw, this.ph, t, this.tabSize, this.tabDepth);
          ctx.lineJoin = 'round';
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.stroke();
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(0,0,0,0.3)';
          ctx.stroke();

          const piece = {
            el, r, c, w: cw, h: ch,
            tx: boardR.x + (c + 0.5) * this.pw,   // Zielmitte
            ty: boardR.y + (r + 0.5) * this.ph,
            x: 0, y: 0, scale: 1, rot: 0,
            locked: false, inTray: true, pointer: null
          };
          this.pieces.push(piece);
          this.attach(piece);
          this.stage.appendChild(el);

          if (lockedSet && lockedSet.has(r + ',' + c)) {
            piece.locked = true;
            piece.inTray = false;
            piece.x = piece.tx;
            piece.y = piece.ty;
            el.classList.add('locked');
            el.style.animation = 'none';
            this.apply(piece);
          }
        }
      }

      this.layoutTray(true);
      this.updateProgress();
    }

    drawBoard() {
      if (!this.bw) return;
      const cv = this.boardCanvas;
      cv.width = Math.round(this.bw * this.dpr);
      cv.height = Math.round(this.bh * this.dpr);
      cv.style.width = this.bw + 'px';
      cv.style.height = this.bh + 'px';
      const ctx = cv.getContext('2d');
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.clearRect(0, 0, this.bw, this.bh);

      // Blasse Vorlage (mit 👁️ kräftiger)
      ctx.globalAlpha = this.showHint ? 0.85 : 0.28;
      ctx.drawImage(this.source, 0, 0, this.bw, this.bh);
      ctx.globalAlpha = 1;

      // Umrisse der Teile als Orientierung
      if (this.hTabs) {
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = 'rgba(180, 83, 9, 0.45)';
        for (let r = 0; r < this.rows; r++)
          for (let c = 0; c < this.cols; c++) {
            piecePath(ctx, c * this.pw, r * this.ph, this.pw, this.ph, this.tabsFor(r, c), this.tabSize, this.tabDepth);
            ctx.stroke();
          }
        ctx.setLineDash([]);
      }
    }

    /* Teile ordentlich in der Ablage verteilen, verkleinert, leicht schräg */
    layoutTray(shuffleSlots) {
      const free = this.pieces.filter((p) => p.inTray && !p.locked);
      if (!free.length) return;

      const tr = this.rectIn(this.tray);
      const pad = 10;
      const aw = tr.w - pad * 2, ah = tr.h - pad * 2;
      const n = free.length;
      const pw = free[0].w, ph = free[0].h;

      let best = { scale: 0, cols: 1, rows: n };
      for (let cols = 1; cols <= n; cols++) {
        const rows = Math.ceil(n / cols);
        const s = Math.min(aw / cols / pw, ah / rows / ph);
        if (s > best.scale) best = { scale: s, cols, rows };
      }
      // Ein bisschen Überlappung ist ok, damit Teile auf dem Handy nicht zu klein werden
      const scale = Math.min(1, best.scale * 1.08);
      const cellW = aw / best.cols, cellH = ah / best.rows;

      if (shuffleSlots || !this.slotOrder || this.slotOrder.length !== this.pieces.length) {
        this.slotOrder = shuffle(this.pieces.map((_, i) => i));
      }
      // Reihenfolge der freien Teile nach gemischter Slot-Reihenfolge
      const ordered = this.slotOrder.map((i) => this.pieces[i]).filter((p) => free.includes(p));
      const lastRowCount = n - (best.rows - 1) * best.cols;

      ordered.forEach((p, i) => {
        const row = Math.floor(i / best.cols);
        let col = i % best.cols;
        // letzte Reihe mittig
        const offset = row === best.rows - 1 ? (best.cols - lastRowCount) / 2 : 0;
        p.slotX = tr.x + pad + (col + offset + 0.5) * cellW;
        p.slotY = tr.y + pad + (row + 0.5) * cellH;
        p.slotScale = scale;
        if (p.slotRot === undefined || shuffleSlots) p.slotRot = (Math.random() - 0.5) * 16;
        this.toTray(p, false);
      });
    }

    toTray(p, animate) {
      p.inTray = true;
      p.x = p.slotX;
      p.y = p.slotY;
      p.scale = p.slotScale;
      p.rot = p.slotRot;
      if (animate) {
        p.el.classList.add('returning');
        setTimeout(() => p.el.classList.remove('returning'), 320);
      }
      this.apply(p);
    }

    apply(p) {
      p.el.style.translate = `${p.x - p.w / 2}px ${p.y - p.h / 2}px`;
      p.el.style.scale = String(p.scale);
      p.el.style.rotate = `${p.rot}deg`;
    }

    /* ---------- Ziehen ---------- */
    attach(p) {
      const el = p.el;

      el.addEventListener('pointerdown', (e) => {
        if (p.locked || p.pointer !== null) return;
        e.preventDefault();
        Sound.pick();
        p.pointer = e.pointerId;
        try { el.setPointerCapture(e.pointerId); } catch (err) {}

        const s = this.stage.getBoundingClientRect();
        const px = e.clientX - s.left, py = e.clientY - s.top;
        // Finger hält das Teil an der gegriffenen Stelle (relativ zur vollen Größe)
        p.offX = (px - p.x) / p.scale;
        p.offY = (py - p.y) / p.scale;
        // Auf kleinen Displays das Teil leicht über den Finger heben, damit man es sieht
        p.lift = Math.min(28, Math.max(0, (p.h / 2 - Math.abs(p.offY)) * 0.4));

        p.scale = 1;
        p.rot = 0;
        p.el.style.zIndex = ++this.zTop;
        el.classList.add('dragging');
        el.classList.remove('returning');
        this.move(p, px, py);
      });

      el.addEventListener('pointermove', (e) => {
        if (p.pointer !== e.pointerId) return;
        const s = this.stage.getBoundingClientRect();
        this.move(p, e.clientX - s.left, e.clientY - s.top);
      });

      const end = (e) => {
        if (p.pointer !== e.pointerId) return;
        p.pointer = null;
        try { el.releasePointerCapture(e.pointerId); } catch (err) {}
        el.classList.remove('dragging');
        this.drop(p);
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('lostpointercapture', end);
    }

    move(p, px, py) {
      const s = this.stage.getBoundingClientRect();
      // Mitte des Teils bleibt immer auf dem Bildschirm
      p.x = Math.min(Math.max(px - p.offX, 0), s.width);
      p.y = Math.min(Math.max(py - p.offY - p.lift, 0), s.height);
      this.apply(p);
    }

    drop(p) {
      const dist = Math.hypot(p.x - p.tx, p.y - p.ty);
      // Großzügiger Fangradius für Kinderhände: 40 % der kürzeren Teilseite
      const snap = Math.max(36, Math.min(this.pw, this.ph) * 0.4);

      if (dist < snap) {
        p.locked = true;
        p.inTray = false;
        p.x = p.tx;
        p.y = p.ty;
        p.el.classList.add('locked');
        this.apply(p);
        Sound.snap();
        buzz(30);
        this.updatePieceState();
        return;
      }

      const tr = this.rectIn(this.tray);
      const overTray = p.x > tr.x && p.x < tr.x + tr.w && p.y > tr.y && p.y < tr.y + tr.h;
      if (overTray) {
        this.toTray(p, true);
      } else {
        p.inTray = false;
      }
      this.updatePieceState();
    }

    updatePieceState() {
      this.updateProgress();
      if (this.pieces.every((p) => p.locked)) this.win();
    }

    updateProgress() {
      const done = this.pieces.filter((p) => p.locked).length;
      let html = '';
      for (let i = 0; i < this.pieces.length; i++) html += `<i class="${i < done ? 'on' : ''}"></i>`;
      this.progressEl.innerHTML = html;
    }

    win() {
      this.won = true;
      setTimeout(() => {
        Sound.win();
        buzz([60, 60, 120]);
        Confetti.start();
        setTimeout(() => ($('win').hidden = false), 600);
      }, 350);
    }
  }

  window.addEventListener('DOMContentLoaded', () => { window.game = new PuzzleGame(); });
  </script>
</body>
