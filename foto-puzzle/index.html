<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kinder Foto-Puzzle 🧩</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    body {
      touch-action: none; /* Verhindert Scrollen und Zoom beim Wischen */
      overflow: hidden;
    }

    .puzzle-piece {
      touch-action: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
      cursor: grab;
      will-change: transform;
      transition: transform 0.05s ease-out, filter 0.2s ease;
      filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.25));
    }

    .puzzle-piece.dragging {
      cursor: grabbing;
      z-index: 1000 !important;
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.35)) brightness(1.05);
      transform: scale(1.08);
    }

    .puzzle-piece.locked {
      cursor: default;
      z-index: 10 !important;
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.15));
      transition: all 0.2s ease-out;
    }

    /* Sanftes Pulsieren für den Upload-Button */
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-amber-100 via-orange-100 to-rose-100 h-[100dvh] w-screen flex flex-col justify-between overflow-hidden">

  <!-- TOP TOOLBAR -->
  <header class="w-full p-2 sm:p-3 bg-white/90 backdrop-blur-md shadow-md rounded-b-3xl z-20 flex flex-col gap-2">
    <div class="flex items-center justify-between px-1">
      <h1 class="text-xl sm:text-2xl font-bold text-orange-600 flex items-center gap-1.5">
        <span>🧩</span> Foto-Puzzle
      </h1>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <!-- Foto Upload Button -->
        <label class="animate-pulse-subtle cursor-pointer bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-bold px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl shadow-md active:scale-95 transition-all text-xs sm:text-sm flex items-center gap-1">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l0.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l0.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Foto wählen</span>
          <input type="file" id="file-input" accept="image/*" class="hidden">
        </label>

        <!-- Vorschau Toggle Button -->
        <button id="btn-preview" class="bg-amber-100 text-amber-800 hover:bg-amber-200 font-semibold p-1.5 sm:p-2 rounded-2xl shadow-sm active:scale-95 transition-all text-xs sm:text-sm flex items-center gap-1 border border-amber-300">
          <span id="preview-icon">👁️</span>
        </button>

        <!-- Reset Button -->
        <button id="btn-reset" class="bg-sky-100 text-sky-800 hover:bg-sky-200 font-semibold p-1.5 sm:p-2 rounded-2xl shadow-sm active:scale-95 transition-all text-xs sm:text-sm flex items-center gap-1 border border-sky-300">
          <span>🔄</span>
        </button>
      </div>
    </div>

    <!-- Puzzleteile Auswahl (Pills) -->
    <div class="flex items-center justify-center gap-2 pt-1 border-t border-orange-100">
      <span class="text-xs font-bold text-gray-500">Teile:</span>
      <button data-grid="2x3" class="btn-grid bg-orange-500 text-white font-bold px-3 py-1 rounded-full text-xs shadow-sm transition-all">6 (2x3)</button>
      <button data-grid="2x4" class="btn-grid bg-white text-gray-700 font-semibold px-3 py-1 rounded-full text-xs shadow-sm transition-all border border-gray-200">8 (2x4)</button>
      <button data-grid="3x3" class="btn-grid bg-white text-gray-700 font-semibold px-3 py-1 rounded-full text-xs shadow-sm transition-all border border-gray-200">9 (3x3)</button>
    </div>
  </header>

  <!-- MAIN GAME AREA -->
  <main id="game-area" class="relative flex-1 w-full flex flex-col items-center justify-between p-2 pb-4 overflow-hidden touch-none">
    
    <!-- PUZZLE BOARD (ZIELFELD) -->
    <div id="board-container" class="relative rounded-2xl border-4 border-dashed border-amber-300/80 bg-white/40 shadow-inner flex items-center justify-center my-auto transition-all">
      <!-- Transparenter Schatten-Hintergrund für Orientierung -->
      <canvas id="board-hint-canvas" class="rounded-xl opacity-30 transition-opacity duration-300 pointer-events-none"></canvas>
    </div>

    <!-- TEILE-VORRAT / TRAY (ABLAGE UNTEN) -->
    <div id="piece-tray" class="w-full max-w-sm h-36 sm:h-44 bg-white/80 backdrop-blur-md rounded-3xl border-2 border-white/90 shadow-lg p-2 relative flex items-center justify-center">
      <div id="tray-placeholder" class="text-gray-400 font-semibold text-xs sm:text-sm text-center pointer-events-none px-4">
        Ziehe die Puzzleteile mit dem Finger nach oben auf das Feld! 👇
      </div>
    </div>

  </main>

  <!-- CELEBRATION MODAL (ERFOLG) -->
  <div id="win-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 shadow-2xl max-w-xs w-full text-center transform transition-all scale-95 animate-bounce-short border-4 border-yellow-300">
      <div class="text-5xl mb-2">🎉🥳</div>
      <h2 class="text-2xl font-bold text-gray-800 mb-1">SUPER GEMACHT!</h2>
      <p class="text-gray-600 text-sm mb-5 font-semibold">Du hast das Puzzle komplett gelöst!</p>
      <button id="btn-win-restart" class="w-full bg-gradient-to-r from-orange-400 to-amber-500 hover:from-orange-500 hover:to-amber-600 text-white font-bold py-3 rounded-2xl shadow-lg active:scale-95 transition-all text-base">
        Nochmal spielen 🚀
      </button>
    </div>
  </div>

  <!-- CONFETTI CANVAS -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-40 hidden"></canvas>

  <script>
    /* ===================================================================
       1. SOUND EFFECT ENGINE (WEB AUDIO API)
       =================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSnap() {
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.08);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      playWin() {
        this.init();
        if (!this.ctx) return;

        const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
        notes.forEach((freq, i) => {
          const now = this.ctx.currentTime + (i * 0.1);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.38);
        });
      }
    }

    /* ===================================================================
       2. CONFETTI ANIMATION ENGINE
       =================================================================== */
    class ConfettiEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.animId = null;
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      start() {
        this.resize();
        this.canvas.classList.remove('hidden');
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        
        this.particles = Array.from({ length: 110 }, () => ({
          x: Math.random() * this.canvas.width,
          y: Math.random() * this.canvas.height - this.canvas.height,
          size: Math.random() * 10 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 4 + 3,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12
        }));

        this.loop();
      }

      stop() {
        if (this.animId) cancelAnimationFrame(this.animId);
        this.canvas.classList.add('hidden');
      }

      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;

          if (p.y > this.canvas.height) p.y = -20;

          this.ctx.save();
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rot * Math.PI) / 180);
          this.ctx.fillStyle = p.color;
          this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          this.ctx.restore();
        });

        this.animId = requestAnimationFrame(() => this.loop());
      }
    }

    /* ===================================================================
       3. DEFAULT DINOSAURIER SVG BILD
       =================================================================== */
    const DEFAULT_DINO_SVG = `data:image/svg+xml;utf8,
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="%237dd3fc"/>
          <stop offset="100%" stop-color="%23bae6fd"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="%2386efac"/>
          <stop offset="100%" stop-color="%2322c55e"/>
        </linearGradient>
        <linearGradient id="dino" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="%234ade80"/>
          <stop offset="100%" stop-color="%2316a34a"/>
        </linearGradient>
      </defs>
      <rect width="800" height="600" fill="url(%23sky)"/>
      <circle cx="700" cy="100" r="60" fill="%23fde047"/>
      <circle cx="700" cy="100" r="75" fill="%23fef08a" opacity="0.4"/>
      <path d="M 100 120 Q 120 90 150 110 Q 180 90 200 120 Q 220 120 210 140 Q 100 160 100 120 Z" fill="white" opacity="0.9"/>
      <path d="M 450 150 Q 470 120 500 140 Q 530 120 550 150 Q 570 150 560 170 Q 450 180 450 150 Z" fill="white" opacity="0.9"/>
      <polygon points="550,450 650,280 750,450" fill="%23a16207"/>
      <polygon points="630,310 650,280 670,310" fill="%23ef4444"/>
      <path d="M 0 420 Q 200 350 400 420 T 800 400 L 800 600 L 0 600 Z" fill="url(%23grass)"/>
      <path d="M 220 420 Q 120 400 100 300 Q 140 360 250 430 Z" fill="url(%23dino)"/>
      <ellipse cx="360" cy="400" rx="140" ry="90" fill="url(%23dino)"/>
      <polygon points="280,320 300,270 320,320" fill="%23f59e0b"/>
      <polygon points="340,310 360,250 380,310" fill="%23f59e0b"/>
      <polygon points="400,320 420,270 440,320" fill="%23f59e0b"/>
      <rect x="280" y="450" width="40" height="80" rx="20" fill="%2315803d"/>
      <rect x="380" y="450" width="40" height="80" rx="20" fill="%2315803d"/>
      <path d="M 440 400 Q 500 360 520 250 Q 560 250 580 290 Q 580 340 480 430 Z" fill="url(%23dino)"/>
      <circle cx="540" cy="250" r="50" fill="url(%23dino)"/>
      <ellipse cx="570" cy="260" rx="35" ry="25" fill="%2386efac"/>
      <circle cx="535" cy="235" r="12" fill="white"/>
      <circle cx="537" cy="235" r="6" fill="%230f172a"/>
      <circle cx="539" cy="233" r="2" fill="white"/>
      <path d="M 555 270 Q 570 280 580 268" fill="none" stroke="%230f172a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="520" cy="260" r="10" fill="%23f43f5e" opacity="0.5"/>
    </svg>`.replace(/\s+/g, ' ');

    /* ===================================================================
       4. PUZZLE ENGINE
       =================================================================== */
    class PuzzleGame {
      constructor() {
        this.gameArea = document.getElementById('game-area');
        this.boardContainer = document.getElementById('board-container');
        this.boardHintCanvas = document.getElementById('board-hint-canvas');
        this.pieceTray = document.getElementById('piece-tray');
        this.fileInput = document.getElementById('file-input');
        this.btnPreview = document.getElementById('btn-preview');
        this.btnReset = document.getElementById('btn-reset');
        this.winModal = document.getElementById('win-modal');
        this.btnWinRestart = document.getElementById('btn-win-restart');

        this.sound = new SoundEngine();
        this.confetti = new ConfettiEngine(document.getElementById('confetti-canvas'));

        this.img = new Image();
        this.rows = 2;
        this.cols = 3;
        this.pieces = [];
        this.lockedCount = 0;
        this.showPreview = false;

        this.activePiece = null;
        this.pointerOffsetX = 0;
        this.pointerOffsetY = 0;

        this.initEventListeners();
        this.loadDefaultImage();
      }

      initEventListeners() {
        this.fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              this.img = new Image();
              this.img.onload = () => this.startNewGame();
              this.img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
          }
        });

        document.querySelectorAll('.btn-grid').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.btn-grid').forEach(b => {
              b.classList.remove('bg-orange-500', 'text-white');
              b.classList.add('bg-white', 'text-gray-700');
            });
            e.target.classList.remove('bg-white', 'text-gray-700');
            e.target.classList.add('bg-orange-500', 'text-white');

            const [c, r] = e.target.dataset.grid.split('x').map(Number);
            this.cols = c;
            this.rows = r;
            this.startNewGame();
          });
        });

        this.btnPreview.addEventListener('click', () => {
          this.showPreview = !this.showPreview;
          this.boardHintCanvas.style.opacity = this.showPreview ? '0.85' : '0.30';
          this.btnPreview.classList.toggle('bg-amber-300', this.showPreview);
        });

        this.btnReset.addEventListener('click', () => this.startNewGame());
        this.btnWinRestart.addEventListener('click', () => {
          this.winModal.classList.add('hidden');
          this.confetti.stop();
          this.startNewGame();
        });

        window.addEventListener('resize', () => {
          if (this.pieces.length > 0) this.repositionGameElements();
        });
      }

      loadDefaultImage() {
        this.img = new Image();
        this.img.onload = () => this.startNewGame();
        this.img.src = DEFAULT_DINO_SVG;
      }

      startNewGame() {
        this.confetti.stop();
        this.winModal.classList.add('hidden');
        this.lockedCount = 0;

        this.pieces.forEach(p => p.element.remove());
        this.pieces = [];

        // Synchronisation mit dem Mobile Layout (Pixel 8a)
        requestAnimationFrame(() => {
          this.setupBoardSize();
          this.renderBoardHint();
          this.generatePieces();
        });
      }

      setupBoardSize() {
        const maxW = Math.min(window.innerWidth * 0.88, 360);
        const maxH = window.innerHeight * 0.38;

        const imgAspect = (this.img.width && this.img.height) ? (this.img.width / this.img.height) : (4 / 3);
        let boardW = maxW;
        let boardH = boardW / imgAspect;

        if (boardH > maxH) {
          boardH = maxH;
          boardW = boardH * imgAspect;
        }

        this.boardWidth = Math.round(boardW);
        this.boardHeight = Math.round(boardH);

        this.boardContainer.style.width = `${this.boardWidth}px`;
        this.boardContainer.style.height = `${this.boardHeight}px`;

        this.pieceWidth = this.boardWidth / this.cols;
        this.pieceHeight = this.boardHeight / this.rows;
      }

      renderBoardHint() {
        this.boardHintCanvas.width = this.boardWidth;
        this.boardHintCanvas.height = this.boardHeight;
        const ctx = this.boardHintCanvas.getContext('2d');
        ctx.drawImage(this.img, 0, 0, this.boardWidth, this.boardHeight);
      }

      generatePieces() {
        const tabSize = Math.min(this.pieceWidth, this.pieceHeight) * 0.22;

        const hTabs = Array.from({ length: this.rows - 1 }, () =>
          Array.from({ length: this.cols }, () => (Math.random() < 0.5 ? 1 : -1))
        );
        const vTabs = Array.from({ length: this.rows }, () =>
          Array.from({ length: this.cols - 1 }, () => (Math.random() < 0.5 ? 1 : -1))
        );

        const areaRect = this.gameArea.getBoundingClientRect();
        const trayRect = this.pieceTray.getBoundingClientRect();

        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const topTab = r === 0 ? 0 : -hTabs[r - 1][c];
            const rightTab = c === this.cols - 1 ? 0 : vTabs[r][c];
            const bottomTab = r === this.rows - 1 ? 0 : hTabs[r][c];
            const leftTab = c === 0 ? 0 : -vTabs[r][c - 1];

            const pCanvas = document.createElement('canvas');
            const canvasW = Math.round(this.pieceWidth + 2 * tabSize);
            const canvasH = Math.round(this.pieceHeight + 2 * tabSize);
            
            pCanvas.width = canvasW;
            pCanvas.height = canvasH;
            pCanvas.style.width = `${canvasW}px`;
            pCanvas.style.height = `${canvasH}px`;
            pCanvas.className = 'puzzle-piece';

            const ctx = pCanvas.getContext('2d');

            ctx.save();
            ctx.translate(tabSize, tabSize);
            this.drawJigsawPath(ctx, this.pieceWidth, this.pieceHeight, topTab, rightTab, bottomTab, leftTab, tabSize);
            ctx.clip();

            const srcX = (c * this.pieceWidth / this.boardWidth) * this.img.width;
            const srcY = (r * this.pieceHeight / this.boardHeight) * this.img.height;
            const srcW = (this.pieceWidth / this.boardWidth) * this.img.width;
            const srcH = (this.pieceHeight / this.boardHeight) * this.img.height;

            const scaleX = srcW / this.pieceWidth;
            const scaleY = srcH / this.pieceHeight;

            ctx.drawImage(
              this.img,
              srcX - tabSize * scaleX,
              srcY - tabSize * scaleY,
              srcW + 2 * tabSize * scaleX,
              srcH + 2 * tabSize * scaleY,
              -tabSize,
              -tabSize,
              canvasW,
              canvasH
            );
            ctx.restore();

            // Kontur
            ctx.save();
            ctx.translate(tabSize, tabSize);
            this.drawJigsawPath(ctx, this.pieceWidth, this.pieceHeight, topTab, rightTab, bottomTab, leftTab, tabSize);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.stroke();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.stroke();
            ctx.restore();

            const boardRect = this.boardContainer.getBoundingClientRect();
            const targetX = (boardRect.left - areaRect.left) + c * this.pieceWidth - tabSize;
            const targetY = (boardRect.top - areaRect.top) + r * this.pieceHeight - tabSize;

            const initialPos = this.getRandomTrayPosition(trayRect, areaRect, canvasW, canvasH);

            const pieceObj = {
              element: pCanvas,
              row: r,
              col: c,
              x: initialPos.x,
              y: initialPos.y,
              targetX: targetX,
              targetY: targetY,
              tabSize: tabSize,
              isLocked: false
            };

            this.updatePiecePosition(pieceObj);
            this.attachTouchEvents(pieceObj);

            this.gameArea.appendChild(pCanvas);
            this.pieces.push(pieceObj);
          }
        }
      }

      drawJigsawPath(ctx, w, h, top, right, bottom, left, tabSize) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        this.drawJigsawEdge(ctx, 0, 0, w, 0, top, tabSize);
        this.drawJigsawEdge(ctx, w, 0, w, h, right, tabSize);
        this.drawJigsawEdge(ctx, w, h, 0, h, bottom, tabSize);
        this.drawJigsawEdge(ctx, 0, h, 0, 0, left, tabSize);
        ctx.closePath();
      }

      drawJigsawEdge(ctx, x1, y1, x2, y2, tab, tabSize) {
        if (tab === 0) {
          ctx.lineTo(x2, y2);
          return;
        }

        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const ux = dx / len;
        const uy = dy / len;
        
        const nx = -uy * tab;
        const ny = ux * tab;

        const p1x = x1 + ux * (len * 0.36);
        const p1y = y1 + uy * (len * 0.36);

        const p2x = x1 + ux * (len * 0.64);
        const p2y = y1 + uy * (len * 0.64);

        const h1x = x1 + ux * (len * 0.34) + nx * tabSize;
        const h1y = y1 + uy * (len * 0.34) + ny * tabSize;

        const h2x = x1 + ux * (len * 0.66) + nx * tabSize;
        const h2y = y1 + uy * (len * 0.66) + ny * tabSize;

        const headX = x1 + ux * (len * 0.5) + nx * (tabSize * 1.15);
        const headY = y1 + uy * (len * 0.5) + ny * (tabSize * 1.15);

        ctx.lineTo(p1x, p1y);
        ctx.bezierCurveTo(p1x + nx * (tabSize * 0.2), p1y + ny * (tabSize * 0.2), h1x - ux * (tabSize * 0.3), h1y, headX, headY);
        ctx.bezierCurveTo(h2x + ux * (tabSize * 0.3), h2y, p2x + nx * (tabSize * 0.2), p2y + ny * (tabSize * 0.2), p2x, p2y);
        ctx.lineTo(x2, y2);
      }

      getRandomTrayPosition(trayRect, areaRect, pieceW, pieceH) {
        const padding = 6;
        const minX = (trayRect.left - areaRect.left) + padding;
        const maxX = (trayRect.right - areaRect.left) - pieceW - padding;
        const minY = (trayRect.top - areaRect.top) + padding;
        const maxY = (trayRect.bottom - areaRect.top) - pieceH - padding;

        const safeX = maxX > minX ? minX + Math.random() * (maxX - minX) : minX;
        const safeY = maxY > minY ? minY + Math.random() * (maxY - minY) : minY;

        return { x: safeX, y: safeY };
      }

      attachTouchEvents(piece) {
        const el = piece.element;

        el.addEventListener('pointerdown', (e) => {
          if (piece.isLocked) return;

          this.sound.init();
          this.activePiece = piece;

          el.setPointerCapture(e.pointerId);

          const areaRect = this.gameArea.getBoundingClientRect();
          const pointerX = e.clientX - areaRect.left;
          const pointerY = e.clientY - areaRect.top;

          this.pointerOffsetX = pointerX - piece.x;
          this.pointerOffsetY = pointerY - piece.y;

          el.classList.add('dragging');
        });

        el.addEventListener('pointermove', (e) => {
          if (!this.activePiece || this.activePiece !== piece || piece.isLocked) return;

          const areaRect = this.gameArea.getBoundingClientRect();
          const pointerX = e.clientX - areaRect.left;
          const pointerY = e.clientY - areaRect.top;

          piece.x = pointerX - this.pointerOffsetX;
          piece.y = pointerY - this.pointerOffsetY;

          this.updatePiecePosition(piece);
        });

        const handlePointerRelease = (e) => {
          if (!this.activePiece || this.activePiece !== piece || piece.isLocked) return;

          try { el.releasePointerCapture(e.pointerId); } catch(err) {}
          el.classList.remove('dragging');
          this.activePiece = null;

          this.checkSnap(piece);
        };

        el.addEventListener('pointerup', handlePointerRelease);
        el.addEventListener('pointercancel', handlePointerRelease);
      }

      updatePiecePosition(piece) {
        piece.element.style.transform = `translate3d(${piece.x}px, ${piece.y}px, 0)`;
      }

      checkSnap(piece) {
        const dx = piece.x - piece.targetX;
        const dy = piece.y - piece.targetY;
        const distance = Math.hypot(dx, dy);

        const snapThreshold = 40;

        if (distance < snapThreshold) {
          piece.x = piece.targetX;
          piece.y = piece.targetY;
          piece.isLocked = true;
          
          this.updatePiecePosition(piece);
          piece.element.classList.add('locked');

          this.sound.playSnap();

          this.lockedCount++;
          if (this.lockedCount === this.pieces.length) {
            this.triggerWin();
          }
        }
      }

      triggerWin() {
        setTimeout(() => {
          this.sound.playWin();
          this.confetti.start();
          this.winModal.classList.remove('hidden');
        }, 250);
      }

      repositionGameElements() {
        this.setupBoardSize();
        this.renderBoardHint();

        const areaRect = this.gameArea.getBoundingClientRect();
        const boardRect = this.boardContainer.getBoundingClientRect();

        this.pieces.forEach(p => {
          p.targetX = (boardRect.left - areaRect.left) + p.col * this.pieceWidth - p.tabSize;
          p.targetY = (boardRect.top - areaRect.top) + p.row * this.pieceHeight - p.tabSize;

          if (p.isLocked) {
            p.x = p.targetX;
            p.y = p.targetY;
            this.updatePiecePosition(p);
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.game = new PuzzleGame();
    });
  </script>
</body>
